  /* anneau : part des classés à l'objectif */

  const ringC = `<article class="card">

          <li><span class="sw" style="background:var(--warn)"></span><span>${fr(P.qRouge)} – ${fr(P.qVert)} %</span><span class="v num">${X.dist.warn.length}</span><span class="p num">${nC ? fr(X.dist.warn.length / nC * 100) + ' %' : ''}</span></li>
          <li><span class="sw" style="background:var(--crit)"></span><span>&lt; ${fr(P.qRouge)} %</span><span class="v num">${X.dist.low.length}</span><span class="p num">${nC ? fr(X.dist.low.length / nC * 100) + ' %' : ''}</span></li>

    </article>`;

  /* tableau d'équipe par niveau */
  const colOp = (o, st) => `<button class="opc" data-act="op" data-op="${esc(o.np)}">${av(o.op)}<span style="min-width:0"><b>${esc(PP.joli(o.op))}</b><small class="num">${fr(o.lig)} l. · ${fr(o.hpk, 1)} h${o.eE ? ' · ' + fr(o.ppmD) + ' ppm' : ''}</small></span><span class="q num">${o.quota == null ? '—' : fr(o.quota, 1) + ' %'}</span></button>`;

  const boardCols = [
    { st: 1, t: `≥ ${fr(P.qVert)} %`, l: X.dist.ok }, { st: 2, t: `${fr(P.qRouge)} – ${fr(P.qVert)} %`, l: X.dist.warn }, { st: 3, t: `< ${fr(P.qRouge)} %`, l: X.dist.low },

      </div>

  const ess = [
    ['ETP moyen (présents par jour)', c => fr(c.etp, 1)], ['Jours travaillés', c => fr(c.jt)], ['Heures pointées', c => fr(c.hp, 1)], ['Heures de picking', c => fr(c.hpk, 1)],
    ['Heures supplémentaires', c => fr(c.hs, 1)], ['Lignes préparées', c => fr(c.lig)], ['Commandes', c => fr(c.cmd)], ['Contenants', c => fr(c.cont)],
    ['Cadence l/h (soumis)', c => fr(c.cad, 1)], ['Quota équipe % (soumis)', c => fr(c.quota, 1)], ['Erreurs décelées / avérées', c => c.dec + ' / ' + c.ave],
    ['PPM décelée', c => fr(c.ppmD)], ['PPM avérée', c => fr(c.ppmA)]
  ];
  const essC = `<article class="card">
      <div class="c-head"><div><div class="c-title"><span class="n">09</span>L'essentiel <span class="serif" style="font-size:19px">du mois</span></div><div class="c-sub">au ${PP.jdm(per.anchor)} · dernière journée travaillée de la période</div></div></div>

const sumv = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);

/* ════════════ FICHE ════════════ */
function opsOrder() {
  const M = S.M;
  return M.ops.slice().sort((a, b) => ((a.actif === 'NON') - (b.actif === 'NON')) || a.np.localeCompare(b.np, 'fr'));
}
function fiche() {
  const M = S.M, P = M.P, list = opsOrder();

    const per0 = PP.period(M, S.mode, S.date);
    const best = PP.perOp(M, per0.a, per0.b, 1).filter(o => o.lig > 0 && o.op.actif === 'OUI').sort((x, y) => y.lig - x.lig)[0];
    S.op = best ? best.np : (list[0] && list[0].np);
  }
  const F = PP.fiche(M, S.op, S.mode, S.date, todaySer());
  const { op, per, G, Dt, H, I, rk, X } = F;
  const ix = list.findIndex(o => o.np === op.np);

  const rail = `<nav class="rail" aria-label="Opérateurs">
      <span class="r-logo">${ic('users')}</span>

      <div class="r-nav"><button data-act="oprev" aria-label="Opérateur précédent">${ic('left')}</button><button data-act="onext" aria-label="Opérateur suivant">${ic('right')}</button></div>
    </nav>`;

  /* profil */
  const anc = op.entree ? (() => { const t = PP.toDate(todaySer()), e = PP.toDate(op.entree); let m = (t.getUTCFullYear() - e.getUTCFullYear()) * 12 + t.getUTCMonth() - e.getUTCMonth() - (t.getUTCDate() < e.getUTCDate() ? 1 : 0); return PP.dmy(op.entree) + ' · ' + (m >= 12 ? Math.floor(m / 12) + ' an' + (m >= 24 ? 's' : '') + (m % 12 ? ' ' + (m % 12) + ' mois' : '') : m + ' mois'); })() : 'date d\'entrée non renseignée';
  const actif = op.actif === 'NON' ? `<span class="status off"><span class="dot"></span>Sorti${op.sortie ? ' le ' + PP.dm(op.sortie) : ''}</span>` : `<span class="status"><span class="dot"></span>Actif</span>`;

  const prof = `<article class="card prof">
      <div class="banner">${flower()}</div>

        <div class="who"><h2>${esc(op.nom || op.np)} <span class="serif">${esc(PP.joli(op).replace(op.nom, '').trim())}</span></h2>
          <p>${esc([op.role, op.poste, op.contrat].filter(Boolean).join(' · ') || '—')}</p>
          <div class="meta"><span>${ic('id')}matricule ${esc(op.mat || '—')}</span><span>${ic('cal')}${esc(anc)}</span><span>${ic('shield')}${esc(op.habil || 'aucune habilitation saisie')}</span></div></div>
        <div class="acts-r">${actif}${soumis}<button class="btn dark sm" data-act="print">${ic('print')}Imprimer la fiche</button></div>

    </article>`;

      <div class="cal-seg"><div class="seg" role="group" aria-label="Période">${['JOUR', 'SEMAINE', 'MOIS'].map(m => `<button data-act="mode" data-m="${m}" class="${S.mode === m ? 'on' : ''}" aria-pressed="${S.mode === m}">${m[0] + m.slice(1).toLowerCase()}</button>`).join('')}</div></div>

    </article>`;

  /* chiffres */
  const vsT = (v, t, up, d, unit = '') => v == null || t == null ? '' : `<span class="ar ${(up ? v >= t : v <= t) ? 'up' : 'dn'}">${v >= t ? '▲' : '▼'}</span> ${fr(Math.abs(v - t), d)}${unit} vs équipe`;
  const stats = [
    { k: 'Lignes préparées', i: 'box', v: G.presAll ? fr(G.lig) : '—', d: G.jt && H.lig && G.pres ? `<span class="ar ${G.lig / G.pres >= H.lig / Math.max(1, H.pres) ? 'up' : 'dn'}">${G.lig / G.pres >= H.lig / Math.max(1, H.pres) ? '▲' : '▼'}</span> ${fr(Math.abs((G.lig / G.pres) / (H.lig / Math.max(1, H.pres)) - 1) * 100, 1)} % /j vs ${esc(F.prevShort)}` : '', sub: `${G.pres} ${plural(G.pres, 'jour produit', 'jours produits')} · ${fr(G.ligJ)} lignes / jour` },
    { k: 'Cadence', i: 'gauge', v: fr(G.cad, 1), u: 'l/h', d: vsT(G.cad, Dt.cad, true, 1), sub: `objectif ${fr(P.cadObj, 1)} · ${esc(F.prevShort)} : ${fr(H.cad, 1)}` },
    { k: 'Quota', i: 'target', v: fr(G.quota, 1), u: '%', d: vsT(G.quota, Dt.quota, true, 1, ' pt'), sub: `${PP.stQ(P, G.quota) ? ST_TXT[PP.stQ(P, G.quota)] : 'pas de quota'} · ${esc(F.prevShort)} : ${H.quota == null ? '—' : fr(H.quota, 1) + ' %'}` },
    { k: 'PPM décelée', i: 'scan', v: fr(G.ppmD), d: vsT(G.ppmD, Dt.ppmD, false, 0), sub: `${G.dec} ${plural(G.dec, 'erreur')} · seuils ${fr(P.dOrange)} / ${fr(P.dRouge)}` },
    { k: 'PPM avérée', i: 'truck', v: fr(G.ppmA), d: vsT(G.ppmA, Dt.ppmA, false, 0), sub: `${G.ave} ${plural(G.ave, 'litige')} · seuils ${fr(P.aOrange)} / ${fr(P.aRouge)}` },
    { k: 'Heures pointées', i: 'clock', v: G.presAll ? fr(G.hp, 1) : '—', u: 'h', d: `${fr(G.hs, 1)} h supp. · ${fr(G.hhp, 1)} h hors prép.`, sub: `${fr(G.hpk, 1)} h de picking · ${esc(F.prevShort)} : ${H.presAll ? fr(H.hp, 1) + ' h' : '—'}` }
  ];
  const statH = stats.map(s => `<article class="card stat"><div class="s-top"><span class="s-ic">${ic(s.i)}</span>${s.k}</div><strong class="num">${s.v}${s.u && s.v !== '—' ? `<span class="u">${s.u}</span>` : ''}</strong><div class="s-d">${s.d || '&nbsp;'}</div><div class="s-sub">${s.sub}</div></article>`).join('');

  /* profil texte */
  const about = `<article class="card about">
      <div class="c-head"><div class="c-title">Profil</div>${PP.stQ(P, G.quota) ? pill(PP.stQ(P, G.quota), 'quota ' + fr(G.quota, 1) + ' %') : ''}</div>
      <p>${esc(PP.joli(op))}${op.role ? ', ' + esc(op.role.toLowerCase()) : ''}${op.poste ? ' au poste ' + esc(op.poste) : ''}. ${G.presAll ? `Sur ${esc(per.short)} : <b>${fr(G.lig)} lignes</b> en ${G.pres} ${plural(G.pres, 'jour')}, quota <b>${G.quota == null ? '—' : fr(G.quota, 1) + ' %'}</b> (équipe ${Dt.quota == null ? '—' : fr(Dt.quota, 1) + ' %'}), ${G.dec} ${plural(G.dec, 'erreur décelée', 'erreurs décelées')} et ${G.ave} ${plural(G.ave, 'litige')}.` : `Aucune journée dans PROD sur ${esc(per.short)}.`}</p>
      <div class="chips"><span>Rôle <b>${esc(op.role || '—')}</b></span><span>Poste <b>${esc(op.poste || '—')}</b></span><span>Contrat <b>${esc(op.contrat || '—')}</b></span><span>Quota <b>${esc(op.soumis || 'à renseigner')}</b></span></div>
      <dl class="kv num"><dt>Rang quota</dt><dd>${rkTxt(rk.q)}</dd><dt>Rang cadence</dt><dd>${rkTxt(rk.c)}</dd><dt>Rang lignes / jour</dt><dd>${rkTxt(rk.l)}</dd><dt>Régularité (journées ≥ objectif)</dt><dd>${I.reg == null ? '—' : fr(I.reg) + ' %'}</dd></dl>
      ${op.notes ? `<p class="c-foot">Note : ${esc(op.notes)}</p>` : ''}
    </article>`;

  /* production jour par jour (étiquette sur la journée la plus récente) */
  const lastDay = F.days.length ? F.days[F.days.length - 1].d : null;
  const dItems = F.days.map(d => ({
    v: d.q, top: d.q == null ? '' : fr(d.q) + ' %', hi: d.d === lastDay, lbl: F.days.length > 8 ? String(PP.toDate(d.d).getUTCDate()) : PP.J[PP.wdi(d.d)].slice(0, 3),
    c: d.st === 1 ? 'var(--lav-3)' : d.st === 2 ? 'var(--warn)' : d.st === 3 ? 'var(--crit)' : 'var(--ink-4)',
    tip: `${PP.jdm(d.d)}\nQuota : ${d.q == null ? '—' : fr(d.q, 1) + ' %'}${d.st ? ' (' + ST_TXT[d.st] + ')' : d.q != null ? ' (moins de ' + fr(P.hMin) + ' h de picking)' : ''}\n${fr(d.l)} lignes · ${fr(d.t, 2)} h de picking · ${d.cad == null ? '—' : fr(d.cad)} l/h\nDécelées ${d.dec} · avérées ${d.ave}${d.hs ? ' · ' + fr(d.hs, 2) + ' h supp.' : ''}${d.code ? '\nCode pointage : ' + d.code : ''}`
  }));
  const prodC = `<article class="card">
      <div class="focus-h"><div><div class="c-title">Production jour par jour</div><div class="c-sub flat">${S.mode === 'JOUR' ? `ses ${Math.min(24, F.nDays)} dernières journées au ${PP.dm(S.date)}` : `${F.nDays} ${plural(F.nDays, 'journée')} sur ${esc(per.short)}`}</div></div><strong class="num">${fr(G.hpk, 1)} h</strong></div>
      ${F.days.length ? chart(pills(dItems, { max: P.plafond, ref: P.qVert, refLbl: `objectif ${fr(P.qVert)} %` }), 200, 'Quota par journée') : '<div class="empty">Aucune journée sur la période.</div>'}
      <div class="legend"><span><i class="sq" style="background:var(--lav-3)"></i>≥ ${fr(P.qVert)} %</span><span><i class="sq" style="background:var(--warn)"></i>${fr(P.qRouge)} – ${fr(P.qVert)} %</span><span><i class="sq" style="background:var(--crit)"></i>&lt; ${fr(P.qRouge)} %</span><span><i class="sq" style="background:var(--ink-4)"></i>&lt; ${fr(P.hMin)} h de picking</span><span><i style="background:var(--ink);opacity:.35;height:1px"></i>objectif ${fr(P.qVert)} %</span></div>
      ${F.days.length ? `<details class="tv"><summary>Voir le tableau</summary><div style="overflow-x:auto"><table class="tbl num"><thead><tr><th>Jour</th><th>H pick</th><th>Lignes</th><th>l/h</th><th>Quota</th><th>Déc.</th><th>Avé.</th><th>HS</th></tr></thead><tbody>${F.days.slice().reverse().map(d => `<tr><td>${PP.jdm(d.d)}</td><td>${fr(d.t, 2)}</td><td>${fr(d.l)}</td><td>${fr(d.cad)}</td><td>${d.q == null ? '—' : pill(d.st, fr(d.q, 1) + ' %')}</td><td>${d.dec}</td><td>${d.ave}</td><td>${d.hs ? fr(d.hs, 2) : '—'}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
    </article>`;

  /* à retenir */
  const nReg = F.ret.filter(r => r.sev !== 4).length;
  const promo = `<article class="card promo">
      <svg class="swirl" viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="sw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#B9A9F4"/></linearGradient></defs>${[0, 1, 2, 3, 4].map(k => `<ellipse cx="100" cy="${60 + k * 22}" rx="${70 - k * 6}" ry="16" fill="url(#sw)" opacity="${.85 - k * .1}" transform="rotate(${-18 + k * 9} 100 100)"/>`).join('')}</svg>
      <h3>À retenir</h3><div class="c-sub">${nReg ? nReg + ' ' + plural(nReg, 'point') + ' à regarder' : 'rien à signaler'} · ${esc(F.wTxt)}</div>
      ${F.ret.length ? `<ul>${F.ret.slice(0, 7).map(r => `<li class="s${SEV_ST[r.sev]}">${ic(SEV_IC[r.sev])}<span>${esc(r.txt)}</span></li>`).join('')}</ul>` : `<ul><li class="s1">${ic('check')}<span>Rien à signaler pour cette personne.</span></li></ul>`}
      <a class="btn sm" href="index.html">${ic('book')}Revoir les standards</a>
    </article>`;

  /* qualité */
  const qmax = Math.max(1, ...F.types.map(t => t.v)), amax = Math.max(1, ...F.motifs.map(t => t.v));
  const qualC = `<article class="card">
      <div class="c-head"><div><div class="c-title">Qualité</div><div class="c-sub flat">décelées et avérées · ${esc(F.wTxt)}</div></div></div>
      <div class="qual">
        <div><small>PPM décelée</small><strong class="num">${fr(I.ppmD)}</strong>${PP.stD(P, I.ppmD) ? pill(PP.stD(P, I.ppmD), ST_PPM[PP.stD(P, I.ppmD)]) : ''}<div class="q-l num">${I.dec} ${plural(I.dec, 'erreur')} / ${fr(I.lig)} l.<br>équipe : ${fr(F.F.ppmD)} ppm<br>rang : ${rkTxt(rk.d, F.minW, I.lig)}</div></div>
        <div><small>PPM avérée</small><strong class="num">${fr(I.ppmA)}</strong>${PP.stA(P, I.ppmA) ? pill(PP.stA(P, I.ppmA), ST_PPM[PP.stA(P, I.ppmA)]) : ''}<div class="q-l num">${I.ave} ${plural(I.ave, 'litige')} / ${fr(I.lig)} l.<br>équipe : ${fr(F.F.ppmA)} ppm<br>rang : ${rkTxt(rk.a, F.minW, I.lig)}</div></div>
      </div>
      <div class="h4">Décelées par type</div>
      ${F.types.map(t => `<div class="hb ${t.v ? '' : 'z'}"><span>${esc(t.label)}</span><span class="t"><i style="width:${t.v / qmax * 100}%"></i></span><b class="num">${t.v}</b></div>`).join('')}
      <div class="h4">Avérées par motif</div>
      ${F.motifs.map(t => `<div class="hb ${t.v ? '' : 'z'}"><span>${esc(t.label)}</span><span class="t"><i class="a" style="width:${t.v / amax * 100}%"></i></span><b class="num">${t.v}</b></div>`).join('')}
      <div class="c-foot">Rang 1 = le moins d'erreurs · classés : soumis au quota et ≥ ${fr(F.minW)} lignes · litiges remontés avec quelques jours de décalage</div>
    </article>`;

  /* face à l'équipe */
  const T = F.F;
  const cmpRows = [
    ['Quota %', I.quota, T.quota, 1, ' pt', true, rk.q], ['Cadence l/h', I.cad, T.cad, 1, '', true, rk.c],
    ['Lignes / journée de picking', I.ligPickJ, T.ligPickJ, 0, '%', true, rk.l], ['Heures de picking / journée', I.hPickJ, T.hPickJ, 1, ' h', null],
    ['Régularité (% journées ≥ objectif)', I.reg, T.reg, 1, ' pt', true], ['PPM décelée', I.ppmD, T.ppmD, 0, '', false, rk.d],
    ['PPM avérée', I.ppmA, T.ppmA, 0, '', false, rk.a], ['Heures supp. / présence', I.hsPres, T.hsPres, 1, ' h', null],
    ['Part du temps hors préparation', I.partHors, T.partHors, 1, ' pt', null]
  ];
  const ec = (a, b, d, u, up) => {
    if (a == null || b == null) return '—';
    if (u === '%') { if (!b) return '—'; const r = a / b - 1; return `<span class="ec ${up == null ? '' : (r >= 0) === up ? 'up' : 'dn'}">${sign(r * 100, 0, ' %')}</span>`; }
    const x = a - b; return `<span class="ec ${up == null ? '' : (x >= 0) === up ? 'up' : 'dn'}">${sign(x, d, u)}</span>`;
  };
  const cmpC = `<article class="card cmp">
      <div class="c-head"><div><div class="c-title">Face à l'équipe</div><div class="c-sub flat">${esc(F.wTxt)} · vert = mieux que l'équipe</div></div></div>
      <div style="overflow-x:auto"><table class="tbl num"><thead><tr><th>Indicateur</th><th>Lui / elle</th><th>Équipe</th><th>Écart</th><th>Rang</th></tr></thead><tbody>
      ${cmpRows.map(([l, a, b, d, u, up, r]) => `<tr><td>${l}</td><td><b>${fr(a, d)}</b></td><td>${fr(b, d)}</td><td>${ec(a, b, d, u, up)}</td><td>${r ? rkTxt(r) : '—'}</td></tr>`).join('')}
      <tr><td>Journées produites</td><td><b>${I.pres}</b></td><td>${T.jt}</td><td>${I.pres} / ${T.jt} ${plural(T.jt, 'jour')}</td><td>—</td></tr>
      <tr><td>Lignes préparées</td><td><b>${fr(I.lig)}</b></td><td>${fr(T.lig)}</td><td>${T.lig ? fr(I.lig / T.lig * 100, 1) + ' % de l\'équipe' : '—'}</td><td>—</td></tr>
      <tr><td>Erreurs décelées / avérées</td><td><b>${I.dec} / ${I.ave}</b></td><td>${T.dec} / ${T.ave}</td><td>—</td><td>—</td></tr>
      </tbody></table></div>
      <div class="c-foot">Équipe = soumis au quota, ≥ ${fr(P.hMin)} h de picking par jour (PPM : toute l'équipe) · rang 1 = meilleur</div>
    </article>`;

  /* dernières erreurs */
  const lastF = F.last.filter(e => S.errTab === 'all' || e.k === S.errTab);
  const errC = `<article class="card">
      <div class="c-head"><div><div class="c-title">Dernières erreurs</div><div class="c-sub flat">${esc(F.wTxt)}</div></div>
      <div class="mini-seg" role="group" aria-label="Filtre">${[['all', 'Toutes'], ['D', 'Décelées'], ['A', 'Avérées']].map(([k, l]) => `<button data-act="errtab" data-k="${k}" class="${S.errTab === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      ${lastF.length ? `<ul class="notif">${lastF.slice(0, 8).map(e => `<li><span class="n-ic ${e.k === 'D' ? 'd' : 'a'}">${e.k}</span><div><b>${esc(typeLbl(e.type))}</b> · <span class="num">${PP.jdm(e.d)}</span><small>${esc(e.det || (e.k === 'D' ? 'décelée au contrôle' : 'litige client'))}</small></div></li>`).join('')}</ul>` : `<div class="empty">Aucune erreur enregistrée (${esc(F.wTxt)}).</div>`}
      <div class="c-foot">D = décelée (arrêtée au contrôle) · A = avérée (partie chez le client)</div>
    </article>`;

  /* 8 semaines */
  const tr = F.q4 != null && F.q4p != null ? F.q4 - F.q4p : null;
  const wkC = `<article class="card">
      <div class="c-head"><div><div class="c-title">Ses 8 dernières semaines</div><div class="c-sub flat">${tr == null ? 'tendance : pas assez de semaines comparables' : `${tr >= 0 ? '▲ +' : '▼ −'}${fr(Math.abs(tr), 1)} pt de quota · 4 dernières semaines vs 4 précédentes`}</div></div></div>
      ${chart(weeksChart(F.weeks, P), 170, 'Quota par semaine')}
      <div class="legend" style="margin-top:6px"><span><i class="sq" style="background:var(--lav-3)"></i>son quota</span><span><i class="rg"></i>quota moyen de l'équipe</span><span><i style="background:var(--ink-3);height:1px"></i>objectif ${fr(P.qVert)} %</span></div>
      <details class="tv"><summary>Voir le tableau</summary><div style="overflow-x:auto"><table class="tbl num"><thead><tr><th>Semaine</th><th>Jours</th><th>Lignes</th><th>l/h</th><th>Quota</th><th>Équipe</th><th>PPM déc.</th><th>Déc.</th><th>Avé.</th></tr></thead><tbody>${F.weeks.slice().reverse().map(w => `<tr><td>${w.lbl} · ${PP.dm(w.a)}</td><td>${w.jours}</td><td>${fr(w.lig)}</td><td>${fr(w.cad, 1)}</td><td>${w.q == null ? '—' : fr(w.q, 1)}</td><td>${fr(w.qEq, 1)}</td><td>${fr(w.ppmD)}</td><td>${w.dec}</td><td>${w.ave}</td></tr>`).join('')}</tbody></table></div></details>
    </article>`;

  /* vie au poste (RH) */
  const cp = F.comp;
  const rhC = `<article class="card">
      <div class="c-head"><div><div class="c-title">Vie au poste</div><div class="c-sub flat">compteurs à date · événements : ${esc(F.wTxt)}</div></div></div>
      <div class="rh-n"><div><b class="num">${F.RH.positifs}</b><small>positifs</small></div><div><b class="num">${F.RH.ecarts}</b><small>écarts</small></div><div><b class="num">${F.RH.secu}</b><small>dont sécu.</small></div><div><b class="num">${F.RH.sansSuite}</b><small>sans suite</small></div></div>
      <div class="chips" style="margin-top:0"><span>CP <b>${cp && cp.cp != null ? fr(cp.cp, 1) : '—'}</b></span><span>RTT <b>${cp && cp.rtt != null ? fr(cp.rtt, 1) : '—'}</b></span><span>Récup <b>${cp && cp.rec != null ? fr(cp.rec, 1) + ' h' : '—'}</b></span></div>
      <p class="c-foot" style="margin-top:8px">${cp ? 'Compteurs : ' + esc(cp.sit || '—') + (cp.maj ? ' · mis à jour le ' + PP.dm(cp.maj) : '') : 'Pas de compteur suivi pour cette personne (onglet SUIVI RH)'}</p>
      <div class="h4">Derniers événements · tout l'historique</div>
      ${F.events.length ? `<ul class="notif">${F.events.slice(0, 5).map(e => { const pos = e.sens.includes('POSITIF'), neg = e.sens.includes('CART'); return `<li><span class="n-ic ${pos ? 'pos' : neg ? 'neg' : 'neu'}">${ic(pos ? 'up' : neg ? 'down' : 'minus')}</span><div><b>${esc(e.type || '—')}</b> · <span class="num">${PP.dm(e.d)}</span><small>${esc([pos ? 'Positif' : neg ? 'Écart' : e.sens, cap((e.fam || '').toLowerCase()), e.suite ? 'suite : ' + e.suite : 'sans suite'].filter(Boolean).join(' · '))}${e.det ? ' — ' + esc(e.det) : ''}</small></div></li>`; }).join('')}</ul>` : '<div class="empty">Aucun événement saisi.</div>'}
    </article>`;

  /* temps hors préparation */
  const amx = Math.max(1, ...F.acts.map(a => a.h));
  const timeC = `<article class="card">
      <div class="c-head"><div><div class="c-title">Temps hors préparation</div><div class="c-sub flat">${esc(F.wTxt)}</div></div></div>
      <div class="tvals"><div><b class="num">${fr(I.actH, 1)}</b><small>heures déclarées</small></div><div><b class="num">${I.actN}</b><small>interventions</small></div><div><b class="num">${I.hp ? fr(I.actH / I.hp * 100, 1) : '—'}${I.hp ? '<span class="muted" style="font-size:12px"> %</span>' : ''}</b><small>du temps pointé</small></div></div>
      ${F.acts.length ? F.acts.map(a => `<div class="hb" ${tipA(`${cap(a.type.toLowerCase())}\n${fr(a.h, 2)} h · ${a.n} ${plural(a.n, 'fois', 'fois')}${a.last ? '\ndernière fois le ' + PP.dm(a.last) : ''}`)}><span>${esc(cap(a.type.toLowerCase()))}</span><span class="t"><i style="width:${a.h / amx * 100}%;background:var(--ink)"></i></span><b class="num">${fr(a.h, 1)}</b></div>`).join('') : `<div class="empty">Aucune activité hors préparation saisie.</div>`}
      <div class="c-foot">Saisie dans ACTIVITES · ces heures sont retirées du temps de picking (cadence et quota)</div>
    </article>`;

  return `<div class="f-layout">${rail}<div class="f-main">
      <section class="f-row f-1">${prof}${cal}</section>
      <section class="f-row f-stats" aria-label="Chiffres de la période">${statH}</section>
      <section class="f-row f-3">${about}${prodC}${promo}</section>
      <section class="f-row f-4">${qualC}${cmpC}${errC}</section>
      <section class="f-row f-4">${wkC}${rhC}${timeC}</section>
      <p class="foot">${esc(per.lbl)} · ${esc(per.plage)} · ${G.pres} ${plural(G.pres, 'jour produit', 'jours produits')} sur ${per.jt} ${plural(per.jt, 'travaillé', 'travaillés')} par l'équipe · comparé à ${esc(F.prevShort)}.</p>
      ${footer(P)}
    </div></div>`;
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const TYPE_LBL = [[/^ERREUR REF/, 'Erreur de référence'], [/^NON PR.CIS/, 'Non précisée'], [/^QTE \+/, 'Quantité en plus'], [/^QTE -/, 'Quantité en moins'], [/^ORIENTATION/, 'Orientation'], [/^MANQUANT/, 'Manquant'], [/^NON CONFORME/, 'Non conforme'], [/^ENDOMMAG/, 'Endommagé'], [/^COLIS D/, 'Colis dévoyé']];
const typeLbl = t => { const x = TYPE_LBL.find(([re]) => re.test(t || '')); return x ? x[1] : cap(String(t || 'non précisée').toLowerCase()); };
function rkTxt(r, minW, lig) { if (!r) return minW && lig < minW ? `non classé (< ${fr(minW)} l.)` : 'non classé'; return `${r.r}${r.r === 1 ? 'er' : 'e'} / ${r.n}`; }
function flower() {
  return `<svg viewBox="0 0 300 220" aria-hidden="true"><defs><radialGradient id="fl" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#C4B6F6" stop-opacity=".8"/><stop offset="1" stop-color="#9C86EE" stop-opacity=".55"/></radialGradient><filter id="bl"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
  <g transform="translate(170 110)" filter="url(#bl)">${[0, 1, 2, 3, 4, 5, 6].map(k => `<ellipse rx="64" ry="24" cx="40" fill="url(#fl)" transform="rotate(${k * 51.4})" opacity=".85"/>`).join('')}<circle r="14" fill="#fff" opacity=".9"/></g></svg>`;
}

/* ════════════ ÉCRAN D'OUVERTURE ════════════ */
function landing() {
  const h = new Date().getHours(), salut = h >= 18 || h < 5 ? 'Bonsoir' : 'Bonjour';
  const fs = !!window.showOpenFilePicker;
  return `<section class="land">
    <section class="head" style="margin-top:34px"><div><div class="eyebrow"><span class="dot"></span>Pilotage Pick &amp; Pack · CLR Champigneulles 5406</div>
      <h1>${salut}, <span class="serif">${esc(S.nom ? S.nom.split(/\s+/)[0] : 'Pick & Pack')}</span></h1>
      <p class="sub">Ouvrez le classeur Suivi Op : l'accueil et les fiches se calculent ici, à partir de vos onglets de saisie.</p></div></section>
    <div class="drop" id="drop">
      ${S.loading ? `<div class="spin"></div><h2>Lecture de « ${esc(S.loading)} »…</h2><p>Quelques secondes pour un classeur de 3 Mo.</p>` : `
      <div class="big-ic">${ic('upload')}</div>
      <h2>Déposez votre classeur ici</h2>
      <p>Suivi_Op_PP_OFFICIEL.xlsm (ou .xlsx) · le fichier reste sur votre poste, rien n'est envoyé.</p>
      <div class="row">
        ${S.saved ? `<button class="btn lime" data-act="reopen">${ic('refresh')}Rouvrir « ${esc(S.saved.name)} »</button>` : ''}
        <button class="btn ${S.saved ? '' : 'lime'}" data-act="open">${ic('file')}Choisir le classeur…</button>
      </div>
      ${fs ? '' : `<p style="margin-top:14px">Astuce : avec Edge ou Chrome, la page se souvient du classeur et le relit en un clic.</p>`}`}
      ${S.error ? `<div class="err">${esc(S.error)}</div>` : ''}
    </div>
    <div class="steps">
      <div><b>1</b>Saisissez comme d'habitude dans Excel (PROD, ERREURS, SUIVI RH…) puis <strong>enregistrez</strong> (Ctrl + S).</div>
      <div><b>2</b>Ouvrez le classeur ici une fois. Ensuite, le bouton <strong>Actualiser</strong> relit la dernière version enregistrée.</div>
      <div><b>3</b>Lisez l'<strong>Accueil</strong> et les <strong>Fiches</strong> par jour, semaine ou mois. Exporter = impression ou PDF.</div>
    </div>
  </section>`;
}

/* ════════════ RENDU ════════════ */
function render() {
  CH = []; tip.classList.remove('on');
  if (!S.M) { app.innerHTML = `<div class="wrap">${landing()}</div>`; bindDrop(); return; }
  const body = S.view === 'fiche' ? fiche() : accueil();
  app.innerHTML = `<div class="wrap">${topbar()}${body}</div>`;
  drawCharts();
  store.set('view', S.view); store.set('mode', S.mode); if (S.op) store.set('op', S.op);
  document.title = (S.view === 'fiche' && S.op ? PP.joli(S.M.opBy.get(S.op) || { np: S.op }) + ' · ' : '') + 'Pilotage Pick & Pack';
}
function go(fn) { fn(); render(); }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, M = S.M;
  if (a === 'open') return pickFile();
  if (a === 'reopen') return reopen();
  if (a === 'reload') return reload();
  if (a === 'print') return print();
  if (a === 'name') { const n = prompt('Votre prénom (affiché dans l\'accueil) :', S.nom || ''); if (n != null) { S.nom = n.trim(); store.set('nom', S.nom); render(); } return; }
  if (!M) return;
  if (a === 'view') return go(() => { S.view = b.dataset.v; scrollTo(0, 0); });
  if (a === 'mode') return go(() => { S.mode = b.dataset.m; if (S.mode === 'JOUR' && !M.wdSet.has(S.date)) { const i = M.wd.filter(x => x <= S.date).pop(); if (i) S.date = i; } });
  if (a === 'prev' || a === 'next') return go(() => { S.date = PP.step(M, S.mode, S.mode === 'JOUR' ? S.date : S.date, a === 'prev' ? -1 : 1); });
  if (a === 'pick') { const dp = $('#datePick'); const d = PP.toDate(S.date); dp.value = d.toISOString().slice(0, 10); try { dp.showPicker(); } catch (er) { dp.click(); } return; }
  if (a === 'day') return go(() => { S.date = +b.dataset.d; });
  if (a === 'op') return go(() => { S.op = b.dataset.op; S.view = 'fiche'; scrollTo(0, 0); });
  if (a === 'oprev' || a === 'onext') return go(() => { const l = opsOrder(), i = l.findIndex(o => o.np === S.op); S.op = l[(i + (a === 'onext' ? 1 : -1) + l.length) % l.length].np; });
  if (a === 'lb') return go(() => { S.lb = b.dataset.k; });
  if (a === 'perf') return go(() => { S.perf = b.dataset.k; });
  if (a === 'goperf') return go(() => { S.perf = { target: 'quota', box: 'lig', gauge: 'cad', scan: 'ppmD' }[b.dataset.k] || S.perf; setTimeout(() => { const c = document.querySelector('.g-perf'); c && c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30); });
  if (a === 'errtab') return go(() => { S.errTab = b.dataset.k; });
});
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click(); });
app.addEventListener('change', e => {
  if (e.target.id === 'q') {
    const v = e.target.value.trim().toUpperCase(); const M = S.M; if (!M) return;
    const o = M.ops.find(x => x.np === v || PP.joli(x).toUpperCase() === v) || M.ops.find(x => x.np.includes(v));
    e.target.value = '';
    /* rendu différé : remplacer le champ pendant son propre « change » casse le DOM */
    if (o) setTimeout(() => go(() => { S.op = o.np; S.view = 'fiche'; scrollTo(0, 0); }), 0);
  }
});
$('#datePick').addEventListener('change', e => { const v = e.target.value; if (!v || !S.M) return; const [y, m, d] = v.split('-').map(Number); go(() => { S.date = PP.ser(y, m - 1, d); }); });
addEventListener('keydown', e => {
  if (!S.M || e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowLeft' && e.altKey) { e.preventDefault(); go(() => { S.date = PP.step(S.M, S.mode, S.date, -1); }); }
  if (e.key === 'ArrowRight' && e.altKey) { e.preventDefault(); go(() => { S.date = PP.step(S.M, S.mode, S.date, 1); }); }
});

/* ════════════ FICHIER : ouverture, mémoire, relecture ════════════ */
const fileIn = $('#fileIn');
fileIn.addEventListener('change', () => { const f = fileIn.files[0]; if (f) { S.handle = null; loadFile(f); } fileIn.value = ''; });
function bindDrop() {
  const z = $('#drop'); if (!z) return;
  ['dragenter', 'dragover'].forEach(t => z.addEventListener(t, e => { e.preventDefault(); z.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => z.addEventListener(t, e => { e.preventDefault(); z.classList.remove('over'); }));
  z.addEventListener('drop', async e => {
    const it = e.dataTransfer.items && e.dataTransfer.items[0];
    if (it && it.getAsFileSystemHandle) { try { const h = await it.getAsFileSystemHandle(); if (h && h.kind === 'file') return useHandle(h); } catch (er) { /* repli sur le fichier simple */ } }
    const f = e.dataTransfer.files[0]; if (f) { S.handle = null; loadFile(f); }
  });
}
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { if (!e.target.closest('#drop')) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && /\.xls[xmb]$/i.test(f.name)) { S.handle = null; loadFile(f); } } });

const DB = 'pp-pilotage';
function idb(mode, fn) {
  return new Promise((res, rej) => {
    try {
      const rq = indexedDB.open(DB, 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => { const tx = rq.result.transaction('kv', mode), st = tx.objectStore('kv'), r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); };
      rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  });
}
const idbGet = k => idb('readonly', s => s.get(k)).catch(() => null);
const idbSet = (k, v) => idb('readwrite', s => s.put(v, k)).catch(() => null);

async function pickFile() {
  if (window.showOpenFilePicker) {
    try {
      const [h] = await showOpenFilePicker({ multiple: false, types: [{ description: 'Classeur Excel', accept: { 'application/vnd.ms-excel.sheet.macroEnabled.12': ['.xlsm'], 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'], 'application/vnd.ms-excel.sheet.binary.macroEnabled.12': ['.xlsb'] } }] });
      return useHandle(h);
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  fileIn.click();
}
async function useHandle(h) {
  try {
    S.handle = h; idbSet('handle', h); S.saved = h;
    const f = await h.getFile(); await loadFile(f);
  } catch (e) { fail(e); }
}
async function reopen() {
  const h = S.saved; if (!h) return pickFile();
  try {
    let p = await h.queryPermission({ mode: 'read' });
    if (p !== 'granted') p = await h.requestPermission({ mode: 'read' });
    if (p === 'granted') return useHandle(h);
  } catch (e) { /* poignée périmée */ }
  pickFile();
}
async function reload() { if (S.handle) return useHandle(S.handle); return pickFile(); }
function fail(e) {
  S.loading = '';
  const m = String((e && e.message) || e || '');
  S.error = /NotReadable|could not be read|NotFound/i.test(m) ? "Le classeur n'a pas pu être lu. S'il est ouvert dans Excel, enregistrez-le (Ctrl + S) puis réessayez, ou choisissez-le à nouveau." : m || 'Lecture impossible.';
  if (S.M) { alert(S.error); S.error = ''; render(); } else render();
}
async function ensureXLSX() {
  if (window.XLSX) return;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('Bibliothèque de lecture Excel introuvable (dossier vendor/ manquant et pas d\'accès internet).')); document.head.appendChild(s); });
}
async function loadFile(f) {
  const keep = !!S.M;
  S.loading = f.name; S.error = '';
  if (!keep) render(); else document.body.style.cursor = 'progress';
  await new Promise(r => setTimeout(r, 30));
  try {
    const buf = await f.arrayBuffer();
    await ensureXLSX();
    const wb = XLSX.read(new Uint8Array(buf), PP.readOptions());
    const M = PP.build(XLSX, wb, f.name);
    if (!M.prod.length) throw new Error('Aucune ligne de production dans PROD.');
    S.M = M; S.loading = ''; S.loadedAt = new Date();
    if (!keep || S.date == null) S.date = M.maxProd;
    $('#opsList').innerHTML = M.ops.map(o => `<option value="${esc(PP.joli(o))}">${esc(o.np)}</option>`).join('');
    document.body.style.cursor = '';
    render();
  } catch (e) { document.body.style.cursor = ''; fail(e); }
}

/* démarrage */
(async () => {
  render();
  const h = await idbGet('handle');
  if (h && h.getFile) { S.saved = h; render(); }
})();
})();
</script>

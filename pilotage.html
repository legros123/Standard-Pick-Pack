<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pilotage Pick &amp; Pack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<meta name="description" content="Tour de contrôle du service Pick &amp; Pack : charge du jour, reste à faire, heure de fin estimée, rejets et erreurs décelées.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23081020'/%3E%3Cpath d='M6 21l10 5 10-5M6 15.5l10 5 10-5M16 6 6 11l10 5 10-5z' fill='none' stroke='%233987E5' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* PILOTAGE PICK & PACK — tour de contrôle du service.
   Concept de mise en page : un rail fixe en tête répond en permanence aux 5 questions essentielles ;
   en dessous, une scène tournante (une question par écran, 20 s) ; en pied, le fil des écrans et l'info du moment.
   Une seule teinte de donnée (bleu = volume fait), des gris pour le contexte, les couleurs d'état réservées à l'état. */
:root{
  color-scheme:dark;
  --bg:#050912; --bg-2:#0A1325; --panel:#0E1930; --panel-2:#13213C;
  --line:rgba(150,180,240,.17); --line-2:rgba(150,180,240,.07);
  --ink:#F3F6FB; --ink-2:#BCC8DD; --ink-3:#8696B0;
  --data:#3987E5; --data-hi:#7DB8FF; --data-lo:#184F95; --data-ghost:#22324E; --contexte:#A9B4C6;
  --ok:#0CA30C; --ok-bg:rgba(12,163,12,.20); --ok-bd:rgba(40,190,40,.65); --ok-ic:#5FDB5F;
  --warn:#FAB219; --warn-bg:rgba(250,178,25,.16); --warn-bd:rgba(250,178,25,.65); --warn-ic:#FAB219;
  --crit:#D03B3B; --crit-bg:rgba(208,59,59,.24); --crit-bd:rgba(240,100,100,.75); --crit-ic:#FF8A8A;
  --na:#8696B0; --na-bg:rgba(134,150,176,.14); --na-bd:rgba(134,150,176,.45); --na-ic:#9AA9C2;
  --amb:57,135,229;
  --f-d:'Big Shoulders Display','Arial Narrow','Segoe UI',sans-serif;
  --f-t:'Lexend','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --gout:max(16px,1.75rem);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;font-size:clamp(7px,min(.8333vw,1.4815vh),44px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-t);font-size:1rem;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h2,h3,h4,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
[data-niv=ok]{--st:var(--ok);--st-bg:var(--ok-bg);--st-bd:var(--ok-bd);--st-ic:var(--ok-ic)}
[data-niv=warn]{--st:var(--warn);--st-bg:var(--warn-bg);--st-bd:var(--warn-bd);--st-ic:var(--warn-ic)}
[data-niv=crit]{--st:var(--crit);--st-bg:var(--crit-bg);--st-bd:var(--crit-bd);--st-ic:var(--crit-ic)}
[data-niv=na]{--st:var(--na);--st-bg:var(--na-bg);--st-bd:var(--na-bd);--st-ic:var(--na-ic)}
.ic{width:1.35rem;height:1.35rem;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:normal}

/* ───────── fond ───────── */
.fond{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:
  radial-gradient(75% 55% at 50% -14%,rgba(var(--amb),.17),transparent 70%),
  radial-gradient(55% 60% at 0% 108%,rgba(57,135,229,.10),transparent 70%),
  linear-gradient(180deg,var(--bg),var(--bg-2));transition:background 1.2s}
.fond::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);background-size:4rem 4rem;
  -webkit-mask-image:radial-gradient(85% 75% at 50% 45%,#000 15%,transparent 78%);mask-image:radial-gradient(85% 75% at 50% 45%,#000 15%,transparent 78%)}
.fond i{position:absolute;width:62rem;height:62rem;border-radius:50%;background:radial-gradient(closest-side,rgba(57,135,229,.20),transparent);animation:derive 46s ease-in-out infinite alternate}
.fond i:nth-child(1){left:-18rem;top:14rem}
.fond i:nth-child(2){right:-22rem;top:-20rem;animation-duration:58s;animation-direction:alternate-reverse;background:radial-gradient(closest-side,rgba(125,184,255,.13),transparent)}
@keyframes derive{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(9rem,-6rem,0) scale(1.18)}}

/* ───────── ossature ───────── */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:11.6rem minmax(0,1fr) 4.4rem;
  padding-left:max(var(--gout),env(safe-area-inset-left,0px));padding-right:max(var(--gout),env(safe-area-inset-right,0px))}
.app[data-statut=ok]{--amb:12,163,12}.app[data-statut=warn]{--amb:250,178,25}.app[data-statut=crit]{--amb:208,59,59}

/* ───────── rail des essentiels ───────── */
.rail{display:grid;grid-template-columns:16rem minmax(0,1fr) 16rem;gap:1.6rem;padding-top:1.15rem;min-height:0}
.marque{display:flex;align-items:center;gap:1rem;min-width:0}
.logo{width:4.5rem;height:4.5rem;flex:none;border-radius:1.15rem;display:grid;place-items:center;background:linear-gradient(145deg,rgba(57,135,229,.35),rgba(57,135,229,.08));border:1px solid rgba(125,184,255,.45);color:var(--data-hi)}
.logo svg{width:2.7rem;height:2.7rem;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
.marque-txt{display:grid;gap:.1rem;min-width:0}
.marque-txt b{font:900 2.55rem/.9 var(--f-d);letter-spacing:.05em}
.marque-txt span{font:700 1.5rem/1 var(--f-d);letter-spacing:.15em;color:var(--data-hi)}
.marque-txt small{font:400 .92rem/1.25 var(--f-t);color:var(--ink-3);margin-top:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.essentiels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:1.5rem;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));box-shadow:0 1.6rem 3.5rem -2rem rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.07)}
.ess{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.1rem;padding:.95rem 1.3rem .85rem;min-width:0}
.ess+.ess{border-left:1px solid var(--line)}
.ess::before{content:"";position:absolute;left:0;right:0;top:0;height:.32rem;background:var(--st,transparent);transition:background .6s}
.ess-l{display:flex;align-items:center;gap:.5rem;font:500 .98rem/1.2 var(--f-t);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.ess-l .ic{width:1.2rem;height:1.2rem;color:var(--data-hi)}
.ess-l em{margin-left:auto;padding-left:.4rem;font-style:normal;font-weight:400;font-size:.9rem;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.ess-v{display:flex;align-items:baseline;gap:.55rem;min-width:0;white-space:nowrap}
.ess-v .num{font:900 5.1rem/.92 var(--f-d);letter-spacing:.01em}
.ess-v .u{font:400 1.12rem/1 var(--f-t);color:var(--ink-2)}
.ess-s{display:flex;align-items:center;gap:.6rem;min-height:2.05rem;font:400 1rem/1.2 var(--f-t);color:var(--ink-2);white-space:nowrap;min-width:0;overflow:hidden}
.ess-s>span:last-child{overflow:hidden;text-overflow:ellipsis}
.ess-s .jauge{flex:1;min-width:2rem}
.temps{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:.15rem;min-width:0}
.heure{font:900 5.3rem/.9 var(--f-d);letter-spacing:.03em}
.heure i{font-style:normal;opacity:.55;animation:clign 2s steps(2,jump-none) infinite}
@keyframes clign{50%{opacity:.15}}
.date{font:400 1.1rem/1.2 var(--f-t);color:var(--ink-2)}
.date::first-letter{text-transform:uppercase}
.source{display:flex;align-items:center;gap:.5rem;margin-top:.35rem;padding:.28rem .75rem;border-radius:99px;border:1px solid var(--line);font:500 .92rem/1.1 var(--f-t);color:var(--ink-2);white-space:nowrap;max-width:100%}
.source span{overflow:hidden;text-overflow:ellipsis}
.source i{width:.62rem;height:.62rem;flex:none;border-radius:50%;background:var(--ok-ic);animation:pouls 2s ease-out infinite}
.source[data-etat=demo]{border-color:rgba(125,184,255,.55);background:rgba(57,135,229,.16);color:var(--ink)}
.source[data-etat=demo] i{background:var(--data-hi);animation:none}
.source[data-etat=perime]{border-color:var(--warn-bd);background:var(--warn-bg);color:var(--ink)}
.source[data-etat=perime] i{background:var(--warn-ic);animation:none}
@keyframes pouls{0%{box-shadow:0 0 0 0 rgba(95,219,95,.55)}100%{box-shadow:0 0 0 .7rem rgba(95,219,95,0)}}

/* ───────── composants ───────── */
.pastille{display:inline-flex;align-items:center;gap:.42rem;padding:.3rem .85rem .3rem .5rem;border-radius:99px;border:1px solid var(--st-bd,var(--na-bd));background:var(--st-bg,var(--na-bg));font:500 1rem/1.15 var(--f-t);color:var(--ink);white-space:nowrap}
.pastille .ic{width:1.3rem;height:1.3rem;color:var(--st-ic,var(--na-ic))}
.pastille.grand{font-size:1.3rem;padding:.5rem 1.2rem .5rem .8rem}.pastille.grand .ic{width:1.7rem;height:1.7rem}
.jauge{position:relative;height:.8rem;border-radius:99px;background:var(--data-lo);overflow:hidden}
.jauge>i{position:absolute;inset:0 auto 0 0;width:var(--v,0%);min-width:.4rem;border-radius:99px;background:linear-gradient(90deg,var(--data),var(--data-hi));transition:width 1.1s cubic-bezier(.2,.7,.1,1)}
.jauge.etat{background:rgba(134,150,176,.28)}
.jauge.etat>i{background:var(--st,var(--data))}
.jauge-w{position:relative;padding:.55rem 0}
.jauge-w .jauge{height:1.15rem}
.borne{position:absolute;top:0;bottom:0;width:.22rem;margin-left:-.11rem;border-radius:2px;background:var(--ink)}
.borne::after{content:attr(data-t);position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font:500 .9rem/1.3 var(--f-t);color:var(--ink-2);white-space:nowrap}
.bloc{position:relative;min-width:0;min-height:0;padding:1.3rem 1.6rem 1.35rem;border:1px solid var(--line);border-radius:1.5rem;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.bloc>h3,.titre3{display:flex;align-items:center;gap:.55rem;margin-bottom:.75rem;font:500 1rem/1.2 var(--f-t);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.bloc>h3 .ic,.titre3 .ic{width:1.25rem;height:1.25rem;color:var(--data-hi)}
.bloc[data-niv]{border-color:var(--st-bd)}
.bloc[data-niv]::before{content:"";position:absolute;left:1.6rem;right:1.6rem;top:-1px;height:.28rem;border-radius:0 0 .3rem .3rem;background:var(--st)}
.geant{font:900 12.5rem/.82 var(--f-d);letter-spacing:.005em;white-space:nowrap}
.geant small{font-size:.42em;margin-left:.06em;color:var(--ink-2)}
.gros{font:900 7.2rem/.86 var(--f-d);white-space:nowrap}
.gros small{font:700 .38em/1 var(--f-d);color:var(--ink-2);margin-left:.12em}
.moyen{font:900 4.2rem/.9 var(--f-d);white-space:nowrap}
.expl{font:400 1.18rem/1.42 var(--f-t);color:var(--ink-2)}
.expl b{color:var(--ink);font-weight:700}
.note{font:400 .95rem/1.4 var(--f-t);color:var(--ink-3)}
.note b{color:var(--ink-2);font-weight:500}
.duo{display:flex;align-items:center;gap:1.4rem;min-width:0}
.ligne{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;min-width:0}
.col{display:grid;gap:1.3rem;min-width:0;min-height:0;align-content:stretch}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.3rem;min-width:0}
.mini{display:grid;gap:.15rem;align-content:center;padding:1rem 1.3rem;border:1px solid var(--line);border-radius:1.3rem;background:rgba(255,255,255,.025);min-width:0}
.mini .l{font:500 .9rem/1.2 var(--f-t);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.mini b{font:900 3.5rem/.95 var(--f-d)}
.mini .s{font:400 .95rem/1.25 var(--f-t);color:var(--ink-3)}
.liste-jauges{display:grid;gap:.85rem}
.lj{display:grid;grid-template-columns:9rem minmax(0,1fr) 12.5rem;align-items:center;gap:1.1rem;font:400 1.15rem/1.2 var(--f-t)}
.lj-n{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lj-v{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.lj-v b{color:var(--ink);font-weight:700}
.lj .jauge{height:1rem}
.legende{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;margin-top:.6rem;font:400 .98rem/1.2 var(--f-t);color:var(--ink-2)}
.legende span{display:inline-flex;align-items:center;gap:.5rem}
.cle{display:inline-block;width:1.7rem;height:.28rem;border-radius:2px;background:var(--data)}
.cle.zone{height:.9rem;border-radius:.2rem;background:rgba(57,135,229,.28);border-top:.2rem solid var(--data)}
.cle.gris{background:var(--contexte)}
.cle.tirets{background:repeating-linear-gradient(90deg,var(--data-hi) 0 .45rem,transparent .45rem .75rem)}
.cle.trait{width:.22rem;height:1.1rem;background:var(--ink)}
.cle.carre{width:.95rem;height:.95rem;border-radius:.2rem}
.gr{position:relative;min-height:0;min-width:0}
.gr svg{display:block;width:100%;height:100%;overflow:visible}
.gr text{font-family:var(--f-t);fill:var(--ink-2)}
.vide{display:grid;place-items:center;align-content:center;gap:.5rem;height:100%;min-height:6rem;text-align:center;color:var(--ink-3);font:400 1.1rem/1.4 var(--f-t)}
.vide .ic{width:2.4rem;height:2.4rem}

/* ───────── scène et écrans ───────── */
.scene{position:relative;min-height:0;perspective:170rem}
.ecran{position:absolute;inset:1.25rem 0 .7rem;display:grid;grid-template-rows:auto minmax(0,1fr);gap:1.1rem;opacity:0;visibility:hidden;pointer-events:none;
  transform:translate3d(4%,0,0) rotateY(-7deg) scale(.965);transform-origin:50% 50%;
  transition:opacity .6s ease,transform .85s cubic-bezier(.22,.7,.12,1),visibility 0s linear .85s}
.ecran.actif{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .7s ease .12s,transform .9s cubic-bezier(.22,.7,.12,1) .12s,visibility 0s}
.ecran.sorti{transform:translate3d(-4%,0,0) rotateY(7deg) scale(.965)}
.tete{display:flex;align-items:flex-end;justify-content:space-between;gap:2.5rem;min-width:0}
.tete>div{min-width:0}
.sur{display:flex;align-items:center;gap:.6rem;font:500 .98rem/1.2 var(--f-t);letter-spacing:.2em;text-transform:uppercase;color:var(--data-hi)}
.sur::before{content:"";width:2.2rem;height:.18rem;border-radius:2px;background:var(--data-hi)}
.tete h2{font:900 3.7rem/.95 var(--f-d);letter-spacing:.025em;text-transform:uppercase;margin-top:.25rem;text-wrap:balance}
.verdict{max-width:54rem;text-align:right;font:400 1.5rem/1.32 var(--f-t);color:var(--ink-2);text-wrap:balance}
.verdict b{color:var(--ink);font-weight:700}
.corps{display:grid;gap:1.3rem;min-height:0;min-width:0}
.ecran.entre .anim{animation:monte .75s cubic-bezier(.2,.7,.1,1) both;animation-delay:calc(var(--i,0)*85ms + .28s)}
@keyframes monte{from{opacity:0;transform:translate3d(0,1.4rem,0)}to{opacity:1;transform:none}}

/* vue 3D */
.vue3d{position:relative;min-height:0;min-width:0;border-radius:1.5rem;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(90% 80% at 50% 62%,rgba(57,135,229,.13),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008))}
.vue3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.leg3d{position:absolute;left:1.4rem;right:1.4rem;bottom:1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.6rem;font:400 1.02rem/1.2 var(--f-t);color:var(--ink-2)}
.leg3d span{display:inline-flex;align-items:center;gap:.5rem}
.leg3d .note{margin-left:auto}
.car{display:inline-block;width:1.05rem;height:1.05rem;border-radius:.22rem}
.car.fait{background:var(--data)}.car.reste{background:#5A6E93}.car.venir{background:transparent;border:1.5px dashed var(--ink-3)}
.titre3d{position:absolute;left:1.5rem;top:1.15rem;right:1.5rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;pointer-events:none}
.titre3d .titre3{margin:0}

/* E1 la journée */
.e1{grid-template-columns:1.22fr 1fr}
.e1 .col{grid-template-rows:minmax(0,1fr) auto auto}
.e1 .col>.bloc:first-child{display:grid;align-content:center}
.barre3{display:flex;gap:.2rem;height:2rem;margin-top:1.1rem;border-radius:.6rem;overflow:hidden}
.barre3 i{display:block;min-width:0;border-radius:.35rem;transition:flex-grow 1.1s cubic-bezier(.2,.7,.1,1)}
.barre3 .s-fait{background:linear-gradient(90deg,var(--data),var(--data-hi))}
.barre3 .s-reste{background:#5A6E93}
.barre3 .s-venir{background:repeating-linear-gradient(135deg,rgba(134,150,176,.5) 0 .35rem,rgba(134,150,176,.16) .35rem .7rem)}
.barre3-leg{display:flex;justify-content:space-between;gap:1rem;margin-top:.55rem;font:400 1.02rem/1.2 var(--f-t);color:var(--ink-2)}
.barre3-leg b{color:var(--ink);font-weight:700;margin-left:.35rem}
.barre3-leg span{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap}

/* E2 heure de fin */
.e2{grid-template-columns:.86fr 1.3fr}
.e2 .col{grid-template-rows:auto minmax(0,1fr)}
.horloge-fin{font:900 13.5rem/.84 var(--f-d);letter-spacing:.02em;margin:.1rem 0 .7rem;white-space:nowrap}
.bonshommes{display:flex;flex-wrap:wrap;gap:.35rem .3rem;margin:.2rem 0 .9rem}
.bh{width:2.7rem;height:3.6rem;flex:none}
.bonshommes.grands{gap:.5rem .35rem;align-content:center}
.bonshommes.grands .bh{width:3.15rem;height:4.2rem}
.bh path,.bh circle{fill:var(--data);transition:fill .5s}
.bh.marge path,.bh.marge circle{fill:#5A6E93}
.bh.manque path,.bh.manque circle{fill:none;stroke:var(--crit-ic);stroke-width:1.6;stroke-dasharray:3 2.4}
.graphe{display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* E3 cadence */
.e3{grid-template-columns:.86fr 1.3fr}
.e3 .col{grid-template-rows:minmax(0,1fr) auto}
.quatre{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.3rem;min-width:0}

/* E4 vagues */
.e4{grid-template-columns:1.35fr 1fr}
.e4 .col:first-child{grid-template-rows:minmax(0,1fr) auto}
.e4 .col:first-child>.bloc:first-child{display:grid;grid-template-rows:auto minmax(0,1fr)}
.e4 .col:last-child{grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}
.e4 .col:last-child>.bloc{display:grid;grid-template-rows:auto minmax(0,1fr) auto;align-items:center}
.vagues{display:grid;grid-auto-rows:minmax(0,6.4rem);align-content:start;min-height:0}
.deux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.3rem;min-width:0}
.deux.seul{grid-template-columns:minmax(0,1fr)}
.liste-jauges.serre .lj{grid-template-columns:7.6rem minmax(0,1fr) 9.4rem;gap:.8rem;font-size:1.05rem}
.deux.seul .liste-jauges.serre .lj{grid-template-columns:9rem minmax(0,1fr) 12.5rem;gap:1.1rem;font-size:1.15rem}
.jauge.etat[data-niv=na]>i{background:#5A6E93}
.vg{display:grid;grid-template-columns:5.2rem minmax(0,1fr) 12rem 11.5rem;align-items:center;gap:1.2rem;padding:0;min-height:0;border-bottom:1px solid var(--line-2);font:400 1.12rem/1.2 var(--f-t)}
.vg:last-child{border-bottom:0}
.vg-h{font:900 2.2rem/1 var(--f-d);letter-spacing:.02em}
.vg-v{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.vg-v b{color:var(--ink);font-weight:700}
.vg .jauge{height:1.05rem}
.vg .pastille{justify-self:end}

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;padding:2rem;text-align:center;font:18px sans-serif;color:#F3F6FB;background:#050912">Ce tableau de bord a besoin de JavaScript : activez-le dans le navigateur puis rechargez la page.</p></noscript>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════════
   PILOTAGE PICK & PACK — noyau : outils, modèle de données, calculs, démonstration
   Les données arrivent par le fichier « pilotage_data.js » (écrit par Excel, voir
   outils/pilotage/LISEZMOI.md). Sans ce fichier, la page tourne en démonstration.
   ════════════════════════════════════════════════════════════════════════════ */

/* ───────── 1. Outils ───────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const adoucir = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const NF0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const NF1 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const NF2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fini = v => v != null && isFinite(v);
const n0 = v => (fini(v) ? NF0.format(Math.round(v)) : "–");
const n1 = v => (fini(v) ? NF1.format(v) : "–");
const pluriel = (n, mot, mots) => (Math.abs(n) >= 2 ? (mots || mot + "s") : mot);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (nom, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${nom}"/></svg>`;
const pastille = (niv, txt, grand, icone) => `<span class="pastille${grand ? " grand" : ""}" data-niv="${niv}">${ic(icone || niv)}<span>${esc(txt)}</span></span>`;
const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
const mouvementReduit = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const modeDeroule = () => window.matchMedia("(max-width:860px),(max-aspect-ratio:1/1)").matches;

/* heures : « 14:35 » ou « 14h35 » -> minutes depuis minuit, et retour */
const hm2min = s => {
  if (s == null || s === "") return null;
  if (typeof s === "number") return s;
  const m = /^(\d{1,2})\s*[:hH]\s*(\d{2})/.exec(String(s).trim());
  return m ? (+m[1]) * 60 + (+m[2]) : null;
};
const min2hm = m => {
  if (!fini(m)) return "–";
  m = Math.round(m);
  const h = Math.floor(m / 60) % 24, r = ((m % 60) + 60) % 60;
  return String(h).padStart(2, "0") + ":" + String(r).padStart(2, "0");
};
const duree = m => {
  m = Math.round(Math.abs(m));
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " h" + (r ? " " + String(r).padStart(2, "0") : "");
};
const lirePauses = p => (Array.isArray(p) ? p : []).map(x => [hm2min(x[0]), hm2min(x[1])]).filter(x => x[0] != null && x[1] != null && x[1] > x[0]).sort((a, b) => a[0] - b[0]);
/* minutes réellement travaillées entre a et b (les pauses déclarées sont retirées) */
function minutesProductives(a, b, pauses) {
  if (!(b > a)) return 0;
  let t = b - a;
  for (const [p0, p1] of pauses) t -= Math.max(0, Math.min(b, p1) - Math.max(a, p0));
  return Math.max(0, t);
}
/* avance de « travail » minutes productives à partir de « depart », en sautant les pauses */
function avancer(depart, travail, pauses) {
  let t = depart, r = travail;
  for (const [a, b] of pauses) {
    if (b <= t) continue;
    if (a <= t) { t = b; continue; }
    if (t + r <= a) break;
    r -= a - t; t = b;
  }
  return t + r;
}

/* ───────── 2. Réglages par défaut (repris de PARAMETRES du Suivi Op et de REGLAGES du Contrôle Rejets) ───────── */
const CFG_DEFAUT = {
  site: "CLR Champigneulles", service: "Pick & Pack",
  debut: "06:00", finVisee: "19:00", pauses: [], jalons: ["12:15", "15:15", "17:15", "19:00"],
  effectifPrevu: [],                      // préparateurs prévus par tranche : [["06:00", 6], ["12:30", 15], ["13:30", 9]]
  quotaJour: 620, hRef: 7.4,              // standard Rexel : 620 lignes par poste de 7,4 h
  quotaRouge: 90, quotaVert: 100, quotaMax: 150,   // % du quota : rouge en dessous, vert à partir de, plafond affiché
  milP: 20.5, milM: 60.5, milG: 100.5,    // milieu des tranches de chariots : petits (< 40 lignes), moyens (40 à 79), grands (80 et +)
  coefP: 1.47, coefM: 1.04, coefG: 0.92,  // coefficients de difficulté (PARAMETRES du Suivi Op)
  rejetsMax: 120,                         // objectif site : 120 rejets par jour au maximum
  decOrange: 15, decRouge: 20,            // erreurs décelées par jour, équipe
  ppmDecOrange: 1000, ppmDecRouge: 2000, ppmAveOrange: 180, ppmAveRouge: 220,
  partPick: 0.70,                         // part du Pick & Pack dans le carnet de commandes
  inclureALancer: false,                  // compter dans la charge les lignes pas encore lancées en vague
  fraicheurMin: 10,                       // au-delà, les données sont signalées comme figées
  actifMin: 30                            // « actif » = une ligne validée dans les 30 dernières minutes
};
const NIV = { ok: 0, na: 0, warn: 1, crit: 2 };
const MOT_GLOBAL = { ok: "Tout va bien", warn: "À surveiller", crit: "Action nécessaire" };
const pire = (...n) => n.reduce((a, b) => (NIV[b] > NIV[a] ? b : a), "ok");

const STANDARDS = [
  ["P1", "Prise de poste", "La sécurité commence avant la production."],
  ["P2", "Consommables", "Le bon contenant, au bon moment."],
  ["P3", "Affectation & montage chariot", "Bien s'affecter, bien monter."],
  ["P4", "Préparation détail", "Bien lire, bien prélever, bien coller."],
  ["P5", "Préparation carton", "Bien trier, bien insérer, bien expédier."],
  ["P6", "Préparation retract", "Sécuriser chaque palette avant de gerber."],
  ["P7", "Changement de contenants", "Le bon carton, dès le départ."],
  ["P8", "Ruptures & validation", "Une rupture saisie = un colis conforme."],
  ["P9", "Gestion des déchets", "Trier juste. Évacuer net."],
  ["P10", "Circulation & sécurité", "Chaque déplacement compte."],
  ["P11", "Fin de poste", "Une zone prête pour l'équipe suivante."],
  ["P12", "Aérosol & batterie", "Produits à risque : zéro tolérance sur le conditionnement."],
  ["P13", "Préparation monolignes", "Une étiquette, un article, un C16."],
  ["P14", "Les interdits", "Les règles internes à respecter dans le CLR."],
  ["P15", "Changement de batterie (Togger)", "Manipuler le Togger avec rigueur et sécurité."],
  ["P16", "Les composés", "Prélever les composés avec précision en allée 11."],
  ["P17", "Sécurité incendie", "Évacuer, alerter, intervenir : chacun son rôle."],
  ["P18", "Sécurité au quotidien", "Signaler, circuler, protéger : chaque jour dans le CLR."]
];
const TYPES_ERREUR = ["Manquante", "Quantité +", "Quantité -", "Orientation", "Référence", "Casse"];

/* ───────── 3. Du fichier de données au modèle affiché ───────── */
function calculer(d, forcer) {
  const cfg = Object.assign({}, CFG_DEFAUT, d.cfg || {}, forcer || {});
  const pauses = lirePauses(cfg.pauses);
  const M = { brut: d, cfg, pauses, demo: d.source === "DEMO" };
  M.maj = d.maj ? new Date(d.maj) : new Date();
  if (isNaN(M.maj)) M.maj = new Date();
  const now = M.maj.getHours() * 60 + M.maj.getMinutes() + M.maj.getSeconds() / 60;
  M.now = now;
  M.standardH = cfg.quotaJour / cfg.hRef;

  /* charge */
  const c = d.charge || {};
  M.aCharge = d.charge != null;
  M.fait = +c.fait || 0;
  M.restant = +c.restant || 0;
  M.aLancerInfo = c.aLancer != null ? +c.aLancer || 0 : null;
  M.aLancer = cfg.inclureALancer && M.aLancerInfo ? M.aLancerInfo : 0;
  M.reste = M.restant + M.aLancer;
  M.charge = M.fait + M.reste;
  M.pct = M.charge > 0 ? M.fait / M.charge : 0;
  M.contFaits = c.contFaits != null ? +c.contFaits : null;
  M.tournees = { faites: c.tourneesFaites, ouvertes: c.tourneesOuvertes, libres: c.tourneesLibres };
  M.types = (c.types || []).map(t => ({ lib: t.lib || t.code, fait: +t.fait || 0, restant: +t.restant || 0 }));
  /* coefficient de difficulté : un petit chariot coûte plus cher par ligne qu'un grand (même formule que le Suivi Op) */
  const poids = k => { if (!k) return null; const p = +k.p || 0, m = +k.m || 0, g = +k.g || 0, den = p * cfg.milP + m * cfg.milM + g * cfg.milG; return den > 0 ? (p * cfg.milP * cfg.coefP + m * cfg.milM * cfg.coefM + g * cfg.milG * cfg.coefG) / den : null; };
  M.w = poids(c.classes); M.aPoids = M.w != null; if (!M.aPoids) M.w = 1;

  /* séries horaires */
  M.heures = (d.heures || []).map(x => ({ h: +x.h, lignes: +x.lignes || 0, ops: x.ops != null ? +x.ops : null })).sort((a, b) => a.h - b.h);
  M.quarts = (d.quarts || []).map(x => ({ m: hm2min(x.t), lignes: +x.lignes || 0 })).filter(x => x.m != null).sort((a, b) => a.m - b.m);
  M.operateurs = (d.operateurs || []).map(o => ({ code: o.code, nom: o.nom || o.code, lignes: +o.lignes || 0, tournees: o.tournees, cont: o.cont, premiere: hm2min(o.premiere), derniere: hm2min(o.derniere), w: poids(o) || M.w }));

  /* début réel du poste */
  const premieres = M.operateurs.map(o => o.premiere).filter(fini);
  const hActives = M.heures.filter(x => x.lignes > 0).map(x => x.h * 60);
  M.debut = hm2min(d.premiere) != null ? hm2min(d.premiere) : premieres.length ? Math.min(...premieres) : hActives.length ? Math.min(...hActives) : hm2min(cfg.debut);
  if (!fini(M.debut) || M.debut > now) M.debut = Math.min(now, hm2min(cfg.debut) || now);

  /* ── rythme ──
     Débit de l'équipe = lignes validées par heure. Cadence = lignes par heure et par préparateur, calculée sur les
     heures de présence au picking de chacun : elle reste juste quand deux équipes se croisent. */
  const prodJour = minutesProductives(M.debut, now, pauses);
  M.debitJour = prodJour >= 20 && M.fait >= 30 ? M.fait / (prodJour / 60) : null;      // pas d'estimation sur les toutes premières minutes
  const w0 = Math.max(now - 60, M.debut), prodFen = minutesProductives(w0, now, pauses);
  let lignesFen = null;
  if (M.quarts.length) {
    lignesFen = 0;
    for (const q of M.quarts) {
      const fin = q.m + 15, lon = now < fin ? Math.max(1, now - q.m) : 15, rec = Math.max(0, Math.min(fin, now) - Math.max(q.m, w0));
      if (rec > 0) lignesFen += q.lignes * Math.min(1, rec / lon);
    }
  } else if (M.heures.length) {
    const hc = Math.floor(now / 60), ha = M.heures.find(x => x.h === hc), hb = M.heures.find(x => x.h === hc - 1), dansH = now - hc * 60;
    lignesFen = (ha ? ha.lignes : 0) + (hb ? hb.lignes * clamp((60 - dansH) / 60, 0, 1) : 0);
  }
  M.debitRecent = fini(lignesFen) && prodFen >= 20 ? lignesFen / (prodFen / 60) : null;

  /* effectif */
  const avecLignes = M.operateurs.filter(o => o.lignes > 0);
  if (avecLignes.length) {
    M.presents = avecLignes.length;
    M.actifs = avecLignes.filter(o => fini(o.derniere) && now - o.derniere <= cfg.actifMin).length;
  } else {
    const opsH = M.heures.filter(x => fini(x.ops));
    M.presents = opsH.length ? Math.max(...opsH.map(x => x.ops)) : null;
    M.actifs = opsH.length ? opsH[opsH.length - 1].ops : null;
  }

  /* heures de présence et cadence de chacun (amplitude entre première et dernière validation, pas un temps de travail) */
  let hJour = 0, hFen = 0, ligOps = 0, ligPond = 0;
  for (const o of M.operateurs) {
    const actif = fini(o.derniere) && now - o.derniere <= cfg.actifMin;
    const fin = !fini(o.derniere) ? now : actif ? now : Math.min(now, o.derniere + 5);
    const h = fini(o.premiere) ? minutesProductives(o.premiere, fin, pauses) / 60 : null;
    o.heures = h;
    o.cadence = h && h >= 0.5 ? o.lignes / h : null;
    o.quota = fini(o.cadence) ? Math.min(cfg.quotaMax, o.cadence * o.w / M.standardH * 100) : null;
    o.inactif = fini(o.derniere) ? Math.max(0, now - o.derniere) : null;
    if (h) { hJour += h; ligOps += o.lignes; ligPond += o.lignes * o.w; hFen += minutesProductives(Math.max(o.premiere, w0), fin, pauses) / 60; }
  }
  const cadJour = hJour >= 1 && ligOps >= 30 ? ligOps / hJour : null;
  const cadRecente = fini(lignesFen) && hFen >= 0.5 && prodFen >= 20 ? lignesFen / hFen : null;
  M.pctStandardJour = hJour >= 1 ? ligPond / hJour / M.standardH * 100 : null;                // quota de l'équipe depuis le début du poste
  const melange = (r, j) => (fini(r) && fini(j) ? (r < 0.4 * j ? j : 0.65 * r + 0.35 * j) : fini(r) && r > 0 ? r : j);
  if (fini(cadJour) || fini(cadRecente)) {
    M.cadenceOp = melange(cadRecente, cadJour);
    M.debit = M.actifs > 0 ? M.cadenceOp * M.actifs : melange(M.debitRecent, M.debitJour);
  } else {
    M.debit = melange(M.debitRecent, M.debitJour);
    M.cadenceOp = fini(M.debit) && M.actifs > 0 ? M.debit / M.actifs : null;
  }
  M.pctStandard = fini(M.cadenceOp) ? M.cadenceOp * M.w / M.standardH * 100 : null;           // quota de l'équipe en ce moment

  /* ── heure de fin ──
     Sans planning : l'équipe du moment reste jusqu'au bout. Avec « effectifPrevu » : on applique la cadence
     constatée à l'effectif prévu de chaque tranche horaire. */
  M.finVisee = hm2min(cfg.finVisee);
  M.eta = null; M.etaTot = null; M.etaTard = null; M.horsJour = false;
  M.effectif = (Array.isArray(cfg.effectifPrevu) ? cfg.effectifPrevu : []).map(x => [hm2min(x[0]), +x[1]]).filter(x => x[0] != null && fini(x[1]) && x[1] >= 0).sort((a, b) => a[0] - b[0]);
  const profil = M.effectif.length > 0 && M.actifs > 0 && fini(M.cadenceOp);
  const prevuA = t => { let n = M.actifs; for (const e of M.effectif) if (e[0] <= t && e[0] > now) n = e[1]; return n; };
  const projeter = cad => {                               // cad : lignes par heure et par préparateur
    if (!(cad > 0)) return null;
    if (!(M.actifs > 0)) return null;
    let t = now, r = M.reste, n = M.actifs;
    for (const b of (profil ? M.effectif.map(e => e[0]).filter(h => h > now) : []).concat([1440])) {
      const cap = cad * n * minutesProductives(t, b, pauses) / 60;
      if (n > 0 && cap >= r) return avancer(t, r / (cad * n) * 60, pauses);
      r -= cap; t = b; n = prevuA(b);
    }
    return null;
  };
  if (M.aCharge && M.reste <= 0 && M.fait > 0) M.eta = now;
  else if (M.reste > 0 && fini(M.cadenceOp) && M.actifs > 0) {
    M.eta = projeter(M.cadenceOp);
    M.horsJour = M.eta == null;
    if (!M.horsJour && fini(cadJour) && fini(cadRecente)) { M.etaTot = projeter(Math.max(cadJour, cadRecente)); M.etaTard = projeter(Math.min(cadJour, cadRecente)); }
  } else if (M.reste > 0 && fini(M.debit) && M.debit > 0) {
    const f = avancer(now, M.reste / M.debit * 60, pauses);
    if (f < 1440) M.eta = f; else M.horsJour = true;
  }
  M.ecart = fini(M.eta) && fini(M.finVisee) ? M.finVisee - M.eta : null;      // positif = avance
  const hRest = fini(M.finVisee) ? minutesProductives(now, M.finVisee, pauses) / 60 : 0;
  M.hRestantes = hRest;
  M.debitNecessaire = hRest > 0.05 && M.reste > 0 ? M.reste / hRest : null;
  M.besoinOps = fini(M.cadenceOp) && M.cadenceOp > 0 && fini(M.debitNecessaire) ? M.debitNecessaire / M.cadenceOp : null;
  /* effectif de référence d'ici l'heure visée : la moyenne prévue si le planning est fourni, sinon les actifs du moment */
  M.opsRef = M.actifs; M.opsPrevus = false;
  if (profil && hRest > 0.05) {
    let t = now, n = M.actifs, somme = 0;
    for (const b of M.effectif.map(e => e[0]).filter(h => h > now && h < M.finVisee).concat([M.finVisee])) { somme += n * minutesProductives(t, b, pauses); t = b; n = prevuA(b); }
    M.opsRef = somme / (hRest * 60); M.opsPrevus = M.effectif.some(e => e[0] > now && e[0] < M.finVisee);
  }
  M.margeOps = fini(M.besoinOps) && fini(M.opsRef) ? M.opsRef - M.besoinOps : null;

  /* rejets (contrôle pondéral du convoyeur) */
  const r = d.rejets || null;
  M.rejets = r ? {
    total: +r.total || 0, pese: r.pese != null ? +r.pese : M.contFaits,
    parHeure: (r.parHeure || []).map(x => ({ h: +x.h, n: +x.n || 0 })),
    top: (r.top || []).map(x => ({ art: x.art, lib: x.lib || "", n: +x.n || 0 }))
  } : null;
  if (M.rejets) {
    M.rejets.taux = M.rejets.pese > 0 ? M.rejets.total / M.rejets.pese : null;
    M.rejets.proj = M.pct >= 0.1 && M.pct < 1 ? M.rejets.total / M.pct : M.rejets.total;
  }

  /* erreurs décelées au poste de contrôle */
  const e = d.decelees || null;
  const versListe = o => Array.isArray(o) ? o.map(x => ({ nom: x.nom, n: +x.n || 0 })) : Object.keys(o || {}).map(k => ({ nom: k, n: +o[k] || 0 }));
  M.dec = e ? {
    total: +e.total || 0,
    types: versListe(e.types).sort((a, b) => b.n - a.n),
    allees: e.allees || {}, derniere: e.derniere || null, source: e.source || "",
    hist: e.hist ? { jours: +e.hist.jours || 7, total: +e.hist.total || 0, allees: e.hist.allees || {}, types: versListe(e.hist.types).sort((a, b) => b.n - a.n) } : null
  } : null;
  if (M.dec) M.dec.ppm = M.fait > 0 ? M.dec.total / M.fait * 1e6 : null;

  /* le reste, tel que fourni */
  M.vagues = (d.vagues || []).map(v => ({ num: v.num, heure: v.heure, etat: v.etat || "", ligPrev: +v.ligPrev || 0, ligPrep: +v.ligPrep || 0, ligRupt: +v.ligRupt || 0, contPrev: v.contPrev, contSortie: v.contSortie, cdePrev: +v.cdePrev || 0, cdePrep: +v.cdePrep || 0 }));
  /* reste à préparer par zone d'allées : affiché seulement s'il recoupe le reste à faire des tournées (écart de 15 % au plus) */
  M.zones = (d.zones || []).map(z => ({ lib: z.lib, fait: +z.fait || 0, restant: +z.restant || 0 }));
  const resteZones = M.zones.reduce((s, z) => s + z.restant, 0);
  M.zonesEcart = M.zones.length > 0 && Math.abs(resteZones - M.restant) > Math.max(40, 0.15 * M.restant);
  if (M.zonesEcart) M.zones = [];

/* ───────── 4. Alertes : un constat, une action ───────── */

  if (fini(M.tournees.libres) && fini(M.actifs) && M.tournees.libres >= Math.max(12, M.actifs * 1.5)) push("warn", `${n0(M.tournees.libres)} chariots attendent un préparateur`, "Tournées lancées mais pas encore prises.", "Vérifier l'affectation : priorité aux chariots de la prochaine vague.");

  const rang = { crit: 0, warn: 1 };
  return A.sort((a, b) => rang[a.niv] - rang[b.niv]);
}

/* ───────── Scène 1 : les piles de la journée (à venir -> reste à faire -> fait) ───────── */
class ScenePile extends Scene3D {
  constructor(cv) {
    super(cv);
    this.yaw0 = this.cam.yaw = -0.4; this.cam.pitch = 0.5; this.balancement = 0.1;
    this.marges = [0.03, 0.05, 0.03, 0.25];

  static unitePour(charge) { for (const u of [10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000]) if (charge / u <= 168) return u; return 10000; }

    const P = 1.14, c = Math.floor(i / 30), r = i % 30, col = r % 5, rang = Math.floor(r / 5);

  bornes() {
    const plus = Math.max(this.piles.venir.length, this.piles.reste.length, this.piles.fait.length, 30);
    const haut = Math.ceil(plus / 30) * 1.14 + 0.6, g = this.aVenir ? 11 : 7.4;

  }
  donnees(fait, reste, venir) {

    this.unite = u; this.aVenir = venir != null; this.vals = { fait, reste, venir };

      const a = this.p(this.cx[q], 0, 3.8), bas = Math.max(this.p(this.cx[q] - 3.2, 0, 3.8)[1], this.p(this.cx[q] + 3.2, 0, 3.8)[1]), y = Math.min(bas + tN * 1.55, H - tV * 1.02 - 4);
      this.texte(noms[q], a[0], y, { t: tN, gras: 500, esp: "0.14em", c: q === "fait" ? "rgb(125,184,255)" : `rgb(${ENCRE2})` });
      this.texte(n0(v[q] || 0), a[0], y + tV * 0.92, { t: tV, gras: 900, f: "'Big Shoulders Display','Arial Narrow',sans-serif" });
    }
  }
}

/* ───────── Scène 2 : le convoyeur, la balance et la voie de contrôle ───────── */
class SceneConvoyeur extends Scene3D {
  constructor(cv) {
    super(cv);
    this.yaw0 = this.cam.yaw = -0.92; this.cam.pitch = 0.58; this.balancement = 0.06;
    this.marges = [0.02, 0.2, 0.02, 0.15];
    this.colis = []; this.taux = 0.02; this.prochain = 0; this.serie = 0; this.eclat = null;
  }
  bornes() { return [-6.2, 0, -1.4, 6.6, 4.4, 8.9]; }      /* le tapis déborde du cadre : les colis arrivent et repartent hors champ */
  donnees(taux) { this.taux = fini(taux) ? clamp(taux, 0.003, 0.4) : 0.02; this.rafraichir(); }
  nouveau(x, rejet) {
    const s = this.serie++, a = n => { const v = Math.sin(s * 12.9898 + n * 78.233) * 43758.5453; return v - Math.floor(v); };
    return { x, z: 0, w: 1.05 + a(1) * 0.5, h: 0.65 + a(2) * 0.6, d: 0.95 + a(3) * 0.45, rejet, sortie: false, pese: x > -2 };
  }
  entree() {
    this.colis = []; this.serie = 0; this.prochain = 0.2; this.eclat = null; this.depuis = 0;
    for (let x = -12.6; x < 13; x += 2.65) this.colis.push(this.nouveau(x, false));
    if (this.fige) { const c = this.nouveau(2.2, true); c.sortie = true; c.z = 3.4; c.pese = true; this.colis.push(c); }
  }
  dessiner(dt) {
    const x = this.ctx, H = this.h;
    this.sol(14, 10, 1.3);

    if (!this.fige) {
      this.prochain -= dt;
      if (this.prochain <= 0) { this.prochain = 0.86; this.depuis++; this.colis.push(this.nouveau(-14.6, this.depuis === 2 || Math.random() < this.taux)); }
      for (const c of this.colis) {
        if (c.sortie) c.z += 2.5 * dt;
        else {
          c.x += 3.1 * dt;
          if (!c.pese && c.x >= -2) { c.pese = true; this.eclat = { rejet: c.rejet, t: 0.55 }; }
          if (c.rejet && c.x >= 2.2) { c.sortie = true; c.x = 2.2; }

      if (this.eclat && (this.eclat.t -= dt) <= 0) this.eclat = null;
    }

    const fixe = [];
    for (const px of [-12.9, -8.6, -4.3, 0, 4.3, 8.6, 12.9]) fixe.push({ x: px, y: 0, z: -0.75, w: 0.3, h: 0.78, d: 1.5, c: [30, 42, 66] });
    for (const pz of [2.6, 5.4]) fixe.push({ x: 1.45, y: 0, z: pz, w: 1.5, h: 0.78, d: 0.3, c: [30, 42, 66] });
    this.peindre(fixe);
    this.boite({ x: -15, y: 0.78, z: -0.98, w: 30, h: 0.24, d: 1.96, c: C_ACIER });
    this.boite({ x: 1.3, y: 0.78, z: 0.98, w: 1.8, h: 0.24, d: 6.4, c: [70, 62, 40] });
    /* rouleaux qui défilent */
    x.lineWidth = 1;
    const dec = this.fige ? 0 : (this.t * 3.1) % 1.1;
    for (let rx = -15 + dec; rx < 15; rx += 1.1) { const a = this.p(rx, 1.02, -0.98), b = this.p(rx, 1.02, 0.98); x.strokeStyle = "rgba(255,255,255,.10)"; x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke(); }
    const dz = this.fige ? 0 : (this.t * 2.5) % 1.1;
    for (let rz = 0.98 + dz; rz < 7.38; rz += 1.1) { const a = this.p(1.3, 1.02, rz), b = this.p(3.1, 1.02, rz); x.strokeStyle = "rgba(250,178,25,.22)"; x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke(); }
    this.boite({ x: 0.5, y: 0, z: 7.4, w: 3.4, h: 1.02, d: 1.7, c: [58, 72, 102] });
    /* plateau de pesée */
    this.boite({ x: -2.75, y: 1.02, z: -0.98, w: 1.5, h: 0.05, d: 1.96, c: C_FAIT, a: 0.75, sansTrait: true });
    /* portique + colis, triés ensemble par profondeur */
    const coul = this.eclat ? (this.eclat.rejet ? C_ALERTE : C_BON) : [70, 86, 118];
    const L = [
      { x: -2.16, y: 0, z: -1.5, w: 0.32, h: 3.5, d: 0.32, c: [52, 68, 100] },

    const b = this.p(8.4, 0.9, 0); this.texte("VERS L'EXPÉDITION", this.w - t * 0.9, Math.max(b[1] + t * 2.2, this.h * 0.2 + t), { t, esp: "0.14em", c: `rgb(${ENCRE2})`, al: "right" });
    const c = this.p(2.2, 0, 9.6); this.texte("POSTE DE CONTRÔLE", c[0], Math.min(c[1] + t * 0.4, H - 6), { t, esp: "0.14em", c: "rgb(250,178,25)" });

}

/* ───────── Scène 3 : le plan des allées, hauteur = erreurs décelées ───────── */
class SceneAllees extends Scene3D {
  constructor(cv) {
    super(cv);
    this.yaw0 = this.cam.yaw = -0.72; this.cam.pitch = 0.5; this.balancement = 0.1;
    this.marges = [0.04, 0.13, 0.04, 0.15];
    this.vals = new Array(14).fill(0); this.cibles = this.vals.map(() => 0.45); this.haut = this.cibles.slice(); this.max = 1; this.tete = [];
  }
  bornes() { return [-12.4, 0, -4.6, 12.4, 5.4, 6]; }
  donnees(allees) {
    const a = allees || {};
    this.vals = Array.from({ length: 14 }, (_, i) => +a[String(i + 1).padStart(2, "0")] || +a[String(i + 1)] || 0);
    this.max = Math.max(1, ...this.vals);
    this.cibles = this.vals.map(v => 0.45 + 4.3 * v / this.max);
    this.tete = this.vals.map((v, i) => [v, i]).filter(x => x[0] > 0).sort((p, q) => q[0] - p[0]).slice(0, 3).map(x => x[1]);
    if (this.fige) this.haut = this.cibles.slice();
    this.rafraichir();
  }
  entree() { if (!this.fige) this.haut = this.cibles.map(() => 0.3); }
  dessiner(dt) {
    const x = this.ctx, H = this.h, pas = 1.72, L = [];
    this.sol(14, 6, 1.2);
    for (let i = 0; i < 14; i++) {
      this.haut[i] = this.fige ? this.cibles[i] : lerp(this.haut[i], this.cibles[i], 0.07 + i * 0.004);
      const k = this.vals[i] / this.max;
      L.push({ x: (i - 6.5) * pas - 0.52, y: 0, z: -4.4, w: 1.04, h: this.haut[i], d: 8.8, c: [lerp(24, 125, k), lerp(79, 184, k), lerp(149, 255, k)], i });
    }
    this.peindre(L);
    const tA = clamp(H * 0.04, 11, 34), tV = clamp(H * 0.052, 13, 46);
    for (let i = 0; i < 14; i++) {
      const xc = (i - 6.5) * pas, bas = this.p(xc, 0, 5.3), hautP = this.p(xc, this.haut[i] + 0.25, 4.4), enTete = this.tete.includes(i);
      this.texte(String(i + 1).padStart(2, "0"), bas[0], bas[1] + tA * 0.9, { t: tA, gras: 700, f: "'Big Shoulders Display','Arial Narrow',sans-serif", c: `rgb(${ENCRE2})`, esp: "0.04em" });
      if (this.vals[i] > 0) {
        this.texte(String(this.vals[i]), hautP[0], hautP[1] - 2, { t: enTete ? tV * 1.25 : tV, gras: 900, f: "'Big Shoulders Display','Arial Narrow',sans-serif" });
        if (enTete) { const yy = hautP[1] - tV * 1.25 - 8, r = tV * 0.3; x.fillStyle = "rgb(250,178,25)"; x.beginPath(); x.moveTo(hautP[0], yy - r); x.lineTo(hautP[0] + r, yy + r * 0.75); x.lineTo(hautP[0] - r, yy + r * 0.75); x.closePath(); x.fill(); }
      }
    }
    const g = this.p(-6.5 * pas - 0.9, 0, 5.3);
    this.texte("ALLÉE", g[0], g[1] + tA * 0.9, { t: tA * 0.62, esp: "0.14em", c: `rgb(${ENCRE2})`, al: "right" });
  }
}

/* ───────── Confettis : quand toute la charge du jour est préparée ───────── */
const Fete = (() => {
  let parts = [], raf = 0, cv, ctx, der = 0;
  function pas(ts) {
    const dt = Math.min(0.05, (ts - (der || ts)) / 1000); der = ts;
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < h + 30 && p.vie > 0);
    for (const p of parts) {
      p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.vie -= dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = clamp(p.vie, 0, 1);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(pas); else { cv.hidden = true; raf = 0; }
    void w;
  }
  return {
    lancer() {
      if (mouvementReduit()) return;
      cv = $("#confetti"); ctx = cv.getContext("2d"); cv.hidden = false;
      cv.width = cv.clientWidth; cv.height = cv.clientHeight;
      const w = cv.width, teintes = ["#3987E5", "#7DB8FF", "#F3F6FB", "#184F95"];
      for (let i = 0; i < 170; i++) parts.push({ x: w / 2 + (Math.random() - 0.5) * w * 0.5, y: -20 - Math.random() * 80, vx: (Math.random() - 0.5) * 520, vy: 80 + Math.random() * 260, r: Math.random() * 6, vr: (Math.random() - 0.5) * 9, s: 8 + Math.random() * 10, c: teintes[i % 4], vie: 3.2 + Math.random() * 1.6 });
      der = 0; if (!raf) raf = requestAnimationFrame(pas);
    }
  };
})();


/* ════════════════════════════════════════════════════════════════════════════
   Graphiques (SVG tracé à la main) : une seule teinte de donnée, un seul axe,
   étiquettes directes choisies, valeurs exactes reprises dans le tableau des données.
   ════════════════════════════════════════════════════════════════════════════ */
const vide = msg => `<div class="vide">${ic("na")}<span>${esc(msg)}</span></div>`;
const Gr = {
  dims(el) { const w = el.clientWidth, h = el.clientHeight; return w > 40 && h > 40 ? { w, h, R: rem() } : null; },
  ticks(max, n) {
    const brut = max / (n || 4), p = Math.pow(10, Math.floor(Math.log10(Math.max(brut, 1e-9))));
    const pas = [1, 2, 2.5, 5, 10].map(k => k * p).find(v => v >= brut) || 10 * p, t = [];
    for (let v = 0; v <= max + 1e-9; v += pas) t.push(v);
    return t;
  },
  svg(w, h, titre, corps) { return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(titre)}">${corps}</svg>`; },
  colonne(x0, x1, y1, yb, r) {
    if (yb - y1 < r * 1.2) return `M${x0} ${yb}V${y1}H${x1}V${yb}Z`;
    return `M${x0} ${yb}V${y1 + r}Q${x0} ${y1} ${x0 + r} ${y1}H${x1 - r}Q${x1} ${y1} ${x1} ${y1 + r}V${yb}Z`;
  },
  f(v) { return Math.round(v * 10) / 10; }
};

/* 1. Avancement cumulé : préparé, rythme à tenir, projection */
function grAvancement(el, M) {
  const g = Gr.dims(el); if (!g) return;
  if (!M.aCharge || M.charge <= 0) { el.innerHTML = vide("La charge du jour n'est pas encore connue."); return; }
  const { w, h, R } = g, f = Gr.f, mg = { g: 4.6 * R, d: 1.4 * R, h: 2.4 * R, b: 2.5 * R }, pw = w - mg.g - mg.d, ph = h - mg.h - mg.b;
  const t0 = Math.floor(M.debut / 60) * 60, t1 = Math.min(1440, Math.ceil((Math.max(M.finVisee || 0, M.eta || 0, M.now) + 25) / 30) * 30);
  const yMax = M.charge * 1.12, X = t => mg.g + (t - t0) / (t1 - t0) * pw, Y = v => mg.h + ph - v / yMax * ph;
  let s = "";
  for (const v of Gr.ticks(yMax, 4)) {
    s += `<line x1="${mg.g}" x2="${w - mg.d}" y1="${f(Y(v))}" y2="${f(Y(v))}" stroke="var(--line-2)"/>`;
    s += `<text x="${mg.g - 0.6 * R}" y="${f(Y(v) + 0.32 * R)}" text-anchor="end" font-size="${0.9 * R}">${n0(v)}</text>`;
  }
  const etroit = w < 36 * R, xV = fini(M.finVisee) ? X(M.finVisee) : -999, pasH = etroit ? 4 : (t1 - t0) / 60 > 11 ? 2 : 1;
  for (let t = Math.ceil(t0 / 60) * 60; t <= t1; t += 60 * pasH) if (Math.abs(X(t) - xV) > 5.6 * R) s += `<text x="${f(X(t))}" y="${h - 0.55 * R}" text-anchor="middle" font-size="${0.9 * R}">${t / 60} h</text>`;
  s += `<line x1="${mg.g}" x2="${w - mg.d}" y1="${f(Y(0))}" y2="${f(Y(0))}" stroke="var(--line)"/>`;
  /* charge du jour */
  s += `<line x1="${mg.g}" x2="${w - mg.d}" y1="${f(Y(M.charge))}" y2="${f(Y(M.charge))}" stroke="var(--ink-3)" stroke-width="1"/>`;
  if (!etroit) s += `<text x="${mg.g + 0.5 * R}" y="${f(Y(M.charge) - 0.6 * R)}" font-size="${1 * R}" fill="var(--ink-2)">charge du jour : <tspan font-weight="700" fill="var(--ink)">${n0(M.charge)} lignes</tspan></text>`;
  /* rythme à tenir */
  if (fini(M.finVisee) && M.finVisee > M.debut) {
    s += `<line x1="${f(X(M.debut))}" y1="${f(Y(0))}" x2="${f(xV)}" y2="${f(Y(M.charge))}" stroke="var(--contexte)" stroke-width="${0.14 * R}"/>`;
    s += `<circle cx="${f(xV)}" cy="${f(Y(M.charge))}" r="${0.36 * R}" fill="var(--contexte)" stroke="var(--panel)" stroke-width="2"/>`;
    s += `<line x1="${f(xV)}" x2="${f(xV)}" y1="${f(Y(0))}" y2="${f(Y(0) + 0.5 * R)}" stroke="var(--ink)" stroke-width="2"/>`;
    s += `<text x="${f(xV)}" y="${h - 0.55 * R}" text-anchor="middle" font-size="${0.95 * R}" font-weight="700" fill="var(--ink)">visée ${min2hm(M.finVisee)}</text>`;
  }
  /* préparé */
  const pts = [[M.debut, 0]]; let cum = 0;
  for (const x of M.heures) { if ((x.h + 1) * 60 <= M.now) { cum += x.lignes; pts.push([(x.h + 1) * 60, Math.min(cum, M.fait)]); } }
  pts.push([M.now, M.fait]);
  const ligne = pts.map((p, i) => (i ? "L" : "M") + f(X(p[0])) + " " + f(Y(p[1]))).join("");
  s += `<path d="${ligne}L${f(X(M.now))} ${f(Y(0))}L${f(X(M.debut))} ${f(Y(0))}Z" fill="var(--data)" opacity=".16"/>`;
  s += `<path d="${ligne}" fill="none" stroke="var(--data)" stroke-width="${0.2 * R}" stroke-linejoin="round" stroke-linecap="round"/>`;
  /* maintenant */
  s += `<line x1="${f(X(M.now))}" x2="${f(X(M.now))}" y1="${f(Y(0))}" y2="${f(Y(M.fait))}" stroke="var(--data-hi)" stroke-width="1" opacity=".6"/>`;
  /* projection */
  if (fini(M.eta) && M.reste > 0) {
    s += `<line x1="${f(X(M.now))}" y1="${f(Y(M.fait))}" x2="${f(X(M.eta))}" y2="${f(Y(M.charge))}" stroke="var(--data-hi)" stroke-width="${0.16 * R}" stroke-dasharray="${0.55 * R} ${0.45 * R}" stroke-linecap="round"/>`;
    s += `<circle cx="${f(X(M.eta))}" cy="${f(Y(M.charge))}" r="${0.46 * R}" fill="var(--data-hi)" stroke="var(--panel)" stroke-width="2"/>`;
    const aDroite = X(M.eta) < w - 11 * R;
    s += `<text x="${f(X(M.eta) + (aDroite ? 0.8 : -0.8) * R)}" y="${f(Y(M.charge) - 0.65 * R)}" text-anchor="${aDroite ? "start" : "end"}" font-size="${1.08 * R}" font-weight="700" fill="var(--ink)">fin estimée ${min2hm(M.eta)}</text>`;
  }
  const ideal = fini(M.finVisee) && M.finVisee > M.debut ? M.charge * (M.now - M.debut) / (M.finVisee - M.debut) : 0, dessus = M.fait >= ideal;
  s += `<circle cx="${f(X(M.now))}" cy="${f(Y(M.fait))}" r="${0.5 * R}" fill="var(--data)" stroke="var(--panel)" stroke-width="2"/>`;
  s += `<text x="${f(X(M.now) + (dessus ? -0.8 : 0.9) * R)}" y="${f(Y(M.fait) + (dessus ? -0.75 : 1.5) * R)}" text-anchor="${dessus ? "end" : "start"}" font-size="${1.08 * R}" font-weight="700" fill="var(--ink)">${n0(M.fait)} à ${min2hm(M.now)}</text>`;
  el.innerHTML = Gr.svg(w, h, `Lignes préparées : ${n0(M.fait)} sur ${n0(M.charge)}, fin estimée ${min2hm(M.eta)}`, s);
}

/* 2. Lignes heure par heure, avec le débit à tenir d'ici la fin */
function grHeures(el, M) {
  const g = Gr.dims(el); if (!g) return;
  if (!M.heures.length) { el.innerHTML = vide("Aucune ligne validée pour l'instant."); return; }
  const { w, h, R } = g, f = Gr.f, large = w >= 44 * R, mg = { g: (large ? 8.2 : 3.4) * R, d: 0.8 * R, h: 2.4 * R, b: (large ? 5.6 : 2.4) * R }, pw = w - mg.g - mg.d, ph = h - mg.h - mg.b;
  const h0 = Math.min(M.heures[0].h, Math.floor(M.debut / 60)), h1 = Math.max(M.heures[M.heures.length - 1].h, fini(M.finVisee) ? Math.ceil(M.finVisee / 60) - 1 : 0);
  const n = h1 - h0 + 1, bande = pw / n, lc = Math.min(2.5 * R, bande * 0.56), hc = Math.floor(M.now / 60), pasE = Math.max(1, Math.ceil(2.6 * R / bande));
  const maxL = Math.max(...M.heures.map(x => x.lignes)), besoin = fini(M.debitNecessaire) ? M.debitNecessaire : 0, yMax = Math.max(maxL, besoin) * 1.2 || 1;
  const Y = v => mg.h + ph - v / yMax * ph, yb = Y(0);
  let s = "";
  for (const v of Gr.ticks(yMax, 4)) {
    s += `<line x1="${mg.g}" x2="${w - mg.d}" y1="${f(Y(v))}" y2="${f(Y(v))}" stroke="var(--line-2)"/>`;
    s += `<text x="${mg.g - 0.6 * R}" y="${f(Y(v) + 0.32 * R)}" text-anchor="end" font-size="${0.9 * R}">${n0(v)}</text>`;
  }
  s += `<line x1="${mg.g}" x2="${w - mg.d}" y1="${f(yb)}" y2="${f(yb)}" stroke="var(--line)"/>`;
  const yH = yb + 1.5 * R, yL = yb + 3.2 * R, yO = yb + 4.75 * R;
  if (large) s += `<text x="${mg.g - 0.6 * R}" y="${f(yL)}" text-anchor="end" font-size="${0.92 * R}">lignes</text><text x="${mg.g - 0.6 * R}" y="${f(yO)}" text-anchor="end" font-size="${0.92 * R}">préparateurs</text>`;
  if (large) s += `<line x1="${0.4 * R}" x2="${w - mg.d}" y1="${f(yb + 2.05 * R)}" y2="${f(yb + 2.05 * R)}" stroke="var(--line-2)"/><line x1="${0.4 * R}" x2="${w - mg.d}" y1="${f(yb + 3.65 * R)}" y2="${f(yb + 3.65 * R)}" stroke="var(--line-2)"/>`;
  for (let i = 0; i < n; i++) {
    const hh = h0 + i, xc = mg.g + bande * (i + 0.5), x = M.heures.find(q => q.h === hh), enCours = hh === hc;
    if (i % pasE === 0) s += `<text x="${f(xc)}" y="${f(yH)}" text-anchor="middle" font-size="${0.95 * R}" ${enCours && large ? 'font-weight="700" fill="var(--ink)"' : ""}>${hh} h</text>`;
    if (!x) continue;
    const y1 = Y(x.lignes);
    s += `<path d="${Gr.colonne(f(xc - lc / 2), f(xc + lc / 2), f(y1), f(yb), 0.3 * R)}" fill="var(--data)" ${enCours ? 'opacity=".55"' : ""} data-bulle="${hh} h : ${n0(x.lignes)} lignes${fini(x.ops) ? " · " + x.ops + " préparateurs" : ""}"/>`;
    if (x.lignes === maxL || (enCours && large)) s += `<text x="${f(xc)}" y="${f(y1 - 0.55 * R)}" text-anchor="middle" font-size="${1.05 * R}" font-weight="700" fill="var(--ink)">${enCours ? "en cours" : n0(x.lignes)}</text>`;
    if (!large) continue;
    s += `<text x="${f(xc)}" y="${f(yL)}" text-anchor="middle" font-size="${1 * R}" fill="var(--ink)" style="font-variant-numeric:tabular-nums">${n0(x.lignes)}</text>`;
    if (fini(x.ops)) s += `<text x="${f(xc)}" y="${f(yO)}" text-anchor="middle" font-size="${1 * R}" style="font-variant-numeric:tabular-nums">${x.ops}</text>`;
  }
  /* débit à tenir : de l'heure en cours à l'heure visée */
  if (besoin > 0 && hc >= h0 && hc <= h1) {
    const xa = mg.g + bande * (hc - h0) + bande * 0.08, xb = w - mg.d, yy = Y(besoin);
    s += `<line x1="${f(xa)}" x2="${f(xb)}" y1="${f(yy)}" y2="${f(yy)}" stroke="var(--contexte)" stroke-width="${0.16 * R}" stroke-linecap="round"/>`;
    if (large) s += `<text x="${f(xb)}" y="${f(yy - 0.6 * R)}" text-anchor="end" font-size="${1 * R}" fill="var(--ink)">à tenir : <tspan font-weight="700">${n0(besoin)} par heure</tspan></text>`;
  }
  el.innerHTML = Gr.svg(w, h, "Lignes préparées par heure", s);
}

/* 3. Barres classées (HTML) */
function barresRang(items, classe) {
  const max = Math.max(1, ...items.map(x => x.n));
  return items.map(x => `<div class="${classe || "tm"}"><span>${esc(x.nom)}</span><div class="jauge" style="--v:${(x.n / max * 100).toFixed(1)}%"><i${x.n ? "" : ' style="display:none"'}></i></div><b>${n0(x.n)}</b></div>`).join("");
}

/* 4. Quota de chacun, anonymisé : un point par préparateur, empilés par tranche de 5 % */
function grPoints(el, M) {
  const g = Gr.dims(el); if (!g) return;
  const vals = M.operateurs.map(o => o.quota).filter(fini);
  if (vals.length < 2) { el.innerHTML = vide("Pas encore assez de lignes pour comparer."); return; }
  const { w, h, R } = g, f = Gr.f, mg = { g: 1.4 * R, d: 1.4 * R, h: 2.8 * R, b: 2.8 * R }, pw = w - mg.g - mg.d, yb = h - mg.b;
  const x0 = Math.min(50, Math.floor(Math.min(...vals) / 10) * 10), x1 = Math.max(140, Math.ceil(Math.max(...vals) / 10) * 10), X = v => mg.g + (v - x0) / (x1 - x0) * pw;
  const pas = 5, tas = {}, compte = {};
  vals.forEach(v => { const b = Math.floor(v / pas); compte[b] = (compte[b] || 0) + 1; });
  const haut = Math.max(...Object.values(compte)), r = Math.min(1.05 * R, pw / ((x1 - x0) / pas) * 0.45, (yb - mg.h - 0.6 * R) / (haut * 2.25));
  let s = `<line x1="${mg.g}" x2="${w - mg.d}" y1="${yb}" y2="${yb}" stroke="var(--line)"/>`;
  for (let v = Math.ceil(x0 / 20) * 20; v <= x1; v += 20) s += `<text x="${f(X(v))}" y="${yb + 1.5 * R}" text-anchor="middle" font-size="${0.95 * R}">${v} %</text>`;
  const xs = X(100);
  s += `<line x1="${f(xs)}" x2="${f(xs)}" y1="${mg.h - 0.2 * R}" y2="${yb}" stroke="var(--ink)" stroke-width="2"/>`;
  s += `<text x="${f(xs)}" y="${mg.h - 0.9 * R}" text-anchor="middle" font-size="${1.05 * R}" font-weight="700" fill="var(--ink)">quota 100 %</text>`;
  vals.slice().sort((a, b) => a - b).forEach(v => {
    const b = Math.floor(v / pas), k = tas[b] = (tas[b] || 0) + 1, cx = X((b + 0.5) * pas), cy = yb - r - 3 - (k - 1) * (2 * r + 3);
    s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="var(--data)" stroke="var(--panel)" stroke-width="2" data-bulle="${n0(v)} % du quota"/>`;
  });

/* 5. Carnet des prochains jours : lignes à préparer et préparateurs nécessaires */
function grCarnet(el, M) {
  const g = Gr.dims(el); if (!g) return;
  if (!M.carnet.length) { el.innerHTML = vide("Carnet de commandes non branché."); return; }
  const { w, h, R } = g, f = Gr.f, mg = { g: 4.6 * R, d: 1 * R, h: 2.6 * R, b: 5.2 * R }, pw = w - mg.g - mg.d, ph = h - mg.h - mg.b;
  const d = M.carnet.map(x => ({ date: new Date(x.date + "T12:00:00"), lig: Math.round(x.lignes * M.cfg.partPick) }));
  const yMax = Math.max(...d.map(x => x.lig)) * 1.18 || 1, Y = v => mg.h + ph - v / yMax * ph, yb = Y(0), bande = pw / d.length, lc = Math.min(3.4 * R, bande * 0.42);
  let s = "";
  for (const v of Gr.ticks(yMax, 4)) {
    s += `<line x1="${mg.g}" x2="${w - mg.d}" y1="${f(Y(v))}" y2="${f(Y(v))}" stroke="var(--line-2)"/>`;
    s += `<text x="${mg.g - 0.6 * R}" y="${f(Y(v) + 0.32 * R)}" text-anchor="end" font-size="${0.9 * R}">${n0(v)}</text>`;
  }
  s += `<line x1="${mg.g}" x2="${w - mg.d}" y1="${f(yb)}" y2="${f(yb)}" stroke="var(--line)"/>`;
  d.forEach((x, i) => {
    const xc = mg.g + bande * (i + 0.5), y1 = Y(x.lig), besoin = x.lig / M.cfg.quotaJour;
    s += `<path d="${Gr.colonne(f(xc - lc / 2), f(xc + lc / 2), f(y1), f(yb), 0.35 * R)}" fill="var(--data)" data-bulle="${n0(x.lig)} lignes estimées pour le Pick &amp; Pack"/>`;
    const serre = bande < 9 * R;
    s += `<text x="${f(xc)}" y="${f(y1 - 0.6 * R)}" text-anchor="middle" font-size="${(serre ? 0.95 : 1.25) * R}" font-weight="700" fill="var(--ink)">${n0(x.lig)}</text>`;
    s += `<text x="${f(xc)}" y="${f(yb + 1.6 * R)}" text-anchor="middle" font-size="${(serre ? 0.9 : 1.05) * R}" fill="var(--ink)">${esc(x.date.toLocaleDateString("fr-FR", serre ? { weekday: "short", day: "numeric" } : { weekday: "long", day: "numeric" }))}</text>`;
    const lp = Math.min(bande * 0.92, 11.2 * R);
    s += `<rect x="${f(xc - lp / 2)}" y="${f(yb + 2.4 * R)}" width="${f(lp)}" height="${2.1 * R}" rx="${1.05 * R}" fill="rgba(57,135,229,.2)" stroke="rgba(125,184,255,.55)"/>`;
    s += `<text x="${f(xc)}" y="${f(yb + 3.8 * R)}" text-anchor="middle" font-size="${1.05 * R}" font-weight="700" fill="var(--ink)">${n1(besoin)}${serre ? "" : " préparateurs"}</text>`;
  });
  el.innerHTML = Gr.svg(w, h, "Lignes à préparer sur les prochains jours", s);
}

/* 6. Courbe d'historique : aire légère, dernier point mis en avant, moyenne en repère */
function grHistorique(el, serie, o) {
  const g = Gr.dims(el); if (!g) return;
  o = o || {};
  const v = serie.filter(x => fini(x.v));
  if (v.length < 3) { el.innerHTML = vide("Historique non branché."); return; }
  const { w, h, R } = g, f = Gr.f, compact = !!o.compact;
  const mg = compact ? { g: 0.3 * R, d: 4.4 * R, h: 0.9 * R, b: 0.5 * R } : { g: 0.6 * R, d: 5.6 * R, h: 1.6 * R, b: 2 * R }, pw = w - mg.g - mg.d, ph = h - mg.h - mg.b;
  const vs = v.map(x => x.v), repere = o.repere, lo = Math.min(...vs, fini(repere) ? repere : Infinity), hi = Math.max(...vs, fini(repere) ? repere : -Infinity), e = (hi - lo) || 1;
  const y0 = o.zero ? 0 : lo - e * 0.12, y1 = hi + e * 0.12, X = i => mg.g + (v.length > 1 ? i / (v.length - 1) : 0.5) * pw, Y = q => mg.h + ph - (q - y0) / (y1 - y0) * ph;
  const ligne = v.map((x, i) => (i ? "L" : "M") + f(X(i)) + " " + f(Y(x.v))).join("");
  let s = `<path d="${ligne}L${f(X(v.length - 1))} ${f(mg.h + ph)}L${f(X(0))} ${f(mg.h + ph)}Z" fill="var(--data)" opacity=".13"/>`;
  if (fini(repere)) {
    s += `<line x1="${mg.g}" x2="${f(mg.g + pw)}" y1="${f(Y(repere))}" y2="${f(Y(repere))}" stroke="var(--contexte)" stroke-width="1.5"/>`;
    if (!compact) s += `<text x="${f(mg.g + 0.3 * R)}" y="${f(Y(repere) - 0.45 * R)}" font-size="${0.9 * R}">${esc(o.repereTxt || "")}</text>`;
  }
  s += `<path d="${ligne}" fill="none" stroke="var(--data)" stroke-width="${(compact ? 0.15 : 0.18) * R}" stroke-linejoin="round" stroke-linecap="round"/>`;
  const der = v[v.length - 1];
  s += `<circle cx="${f(X(v.length - 1))}" cy="${f(Y(der.v))}" r="${(compact ? 0.38 : 0.46) * R}" fill="var(--data-hi)" stroke="var(--panel)" stroke-width="2"/>`;
  s += `<text x="${f(X(v.length - 1) + 0.8 * R)}" y="${f(Y(der.v) + 0.38 * R)}" font-size="${(compact ? 0.98 : 1.1) * R}" font-weight="700" fill="var(--ink)">${o.fmt ? o.fmt(der.v) : n0(der.v)}</text>`;
  if (!compact) {
    s += `<text x="${mg.g}" y="${h - 0.4 * R}" font-size="${0.9 * R}">${esc(v[0].l || "")}</text>`;
    s += `<text x="${f(mg.g + pw)}" y="${h - 0.4 * R}" text-anchor="end" font-size="${0.9 * R}">${esc(der.l || "")}</text>`;
  }
  el.innerHTML = Gr.svg(w, h, o.titre || "Historique", s);
}

/* 7. Petites colonnes (rejets par heure) */
function grMiniColonnes(el, vals, unite) {
  const g = Gr.dims(el); if (!g) return;
  if (!vals.length) { el.innerHTML = ""; return; }
  const { w, h, R } = g, f = Gr.f, mg = { g: 0.2 * R, d: 0.2 * R, h: 1.6 * R, b: 1.5 * R }, pw = w - mg.g - mg.d, ph = h - mg.h - mg.b;
  const max = Math.max(1, ...vals.map(x => x.n)), bande = pw / vals.length, lc = Math.min(1.5 * R, bande * 0.6), yb = mg.h + ph;
  let s = `<line x1="${mg.g}" x2="${w - mg.d}" y1="${yb}" y2="${yb}" stroke="var(--line)"/>`, etiq = false;
  vals.forEach((x, i) => {
    const xc = mg.g + bande * (i + 0.5), y1 = yb - x.n / max * ph;
    if (x.n > 0) s += `<path d="${Gr.colonne(f(xc - lc / 2), f(xc + lc / 2), f(y1), f(yb), 0.22 * R)}" fill="var(--data)" data-bulle="${x.h} h : ${n0(x.n)} ${unite}"/>`;
    if (x.n === max && !etiq) { etiq = true; s += `<text x="${f(xc)}" y="${f(y1 - 0.4 * R)}" text-anchor="middle" font-size="${0.95 * R}" font-weight="700" fill="var(--ink)">${n0(x.n)}</text>`; }
    if (i === 0 || i === vals.length - 1) s += `<text x="${f(xc)}" y="${f(yb + 1.2 * R)}" text-anchor="middle" font-size="${0.85 * R}">${x.h} h</text>`;
  });
  el.innerHTML = Gr.svg(w, h, "Répartition par heure", s);
}

/* 8. Silhouettes : besoin, marge, manque */
function bonshommes(actifs, besoin) {
  const a = Math.max(0, Math.round(actifs || 0)), b = fini(besoin) ? Math.ceil(besoin - 0.05) : a, n = Math.min(40, Math.max(a, b));
  let s = "";
  for (let i = 0; i < n; i++) {
    const cls = i < Math.min(a, b) ? "" : i < a ? " marge" : " manque";
    s += `<svg class="bh${cls}" viewBox="0 0 24 32" aria-hidden="true"><circle cx="12" cy="6" r="5"/><path d="M2.500 30c0-9 3.500-15 9.500-15s9.500 6 9.500 15z"/></svg>`;
  }
  return s;
}
